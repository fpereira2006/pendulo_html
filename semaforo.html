let chartToggleBounds = null;
let hoverChartToggle = false;
let toastText = null;
let toastColor = null;
let toastStart = -10;

const SCENE_HEIGHT_NARROW = 560;

/**
 * Fits the scene to the window. Wide screens use the full layout at 1:1; small screens draw
 * the same scene scaled down, and phones stack the two cards on top of the intersection.
 */
function layout() {
  const stacked = window.matchMedia('(max-width: 999px)').matches;
  const cssW = stage.clientWidth;
  let scale;
  let logicalH;
  let narrow = false;
  if (cssW < 600) {
    narrow = true;
    scale = Math.max(0.45, Math.min(1, cssW / 650));
    const cards = HUD_MARGIN + ui(150) + 12 + cardHeight();
    logicalH = cards + SCENE_HEIGHT_NARROW;
  } else if (stacked) {
    // Short screens (a phone lying down) keep a readable scale and let the page scroll.
    const availH = Math.max(window.innerHeight * 0.92, 360);
    scale = Math.max(Math.min(1, cssW / 900, availH / 700), Math.min(1, cssW / 900, 0.65));
    logicalH = Math.max(700, Math.min(800, availH / scale));
  } else {
    scale = Math.min(1, cssW / 900, stage.clientHeight / 700);
    logicalH = stage.clientHeight / scale;
  }
  if (stacked) {
    stage.style.setProperty('--stage-height', Math.round(logicalH * scale) + 'px');
  }
  const cssH = stacked ? Math.round(logicalH * scale) : stage.clientHeight;
  const ratio = window.devicePixelRatio || 1;
  view.narrow = narrow;
  view.scale = scale;
  view.ratio = ratio;
  view.cssW = cssW;
  view.cssH = cssH;
  view.W = cssW / scale;
  view.H = cssH / scale;
  const pixelW = Math.max(1, Math.round(cssW * ratio));
  const pixelH = Math.max(1, Math.round(cssH * ratio));
  if (canvas.width !== pixelW || canvas.height !== pixelH) {
    canvas.width = pixelW;
    canvas.height = pixelH;
  }
}

function cardHeight() {
  return ui(214);
}

function telemetryRect() {
  if (view.narrow) return { x: HUD_MARGIN, y: HUD_MARGIN, w: view.W - 2 * HUD_MARGIN, h: ui(150) };
  return { x: HUD_MARGIN, y: HUD_MARGIN, w: ui(270), h: cardHeight() };
}

function learningRect() {
  if (view.narrow) {
    const telemetry = telemetryRect();
    return { x: HUD_MARGIN, y: telemetry.y + telemetry.h + 12, w: view.W - 2 * HUD_MARGIN, h: cardHeight() };
  }
  const cardW = ui(270);
  return { x: 2 * HUD_MARGIN + cardW, y: HUD_MARGIN, w: view.W - 3 * HUD_MARGIN - cardW, h: cardHeight() };
}

function cardsBottom() {
  const learning = learningRect();
  return learning.y + learning.h;
}

/** Top of the floor buttons (start, restart, bursts), above the footer. */
function buttonsTop() {
  return view.H - ui(24) - ui(34);
}

/**
 * Where the intersection is drawn: centered between the cards and the buttons, with a scale
 * (pixels per meter) zoomed in: about 22 m of every approach.
 */
function crossing() {
  const top = cardsBottom() + 10;
  const bottom = buttonsTop() - 6;
  const cx = Math.round(view.W / 2);
  const cy = Math.round((top + bottom) / 2);
  const half = Math.min((bottom - top) / 2, view.W / 2);
  const ppm = Math.max(5, Math.min(15, half / 22));
  return { cx, cy, ppm };
}

function render() {
  layout();
  const g = ctx;
  const w = view.W;
  const h = view.H;
  g.setTransform(view.ratio * view.scale, 0, 0, view.ratio * view.scale, 0, 0);
  g.textBaseline = 'alphabetic';

  const now = (performance.now() - startMillis) / 1000;
  const geometry = crossing();
  updateStepRate();

  paintBackdrop(g, w, h, geometry);
  paintCars(g, geometry);
  paintLights(g, geometry, now);
  paintRunButton(g);
  paintBurstButtons(g, w);
  paintToast(g, w, now);

  paintTelemetry(g, telemetryRect(), now);
  paintLearning(g, learningRect());
  paintFooter(g, w, h);
  requestAnimationFrame(render);
}

function updateStepRate() {
  const now = performance.now();
  const elapsed = (now - rateSampleMillis) / 1000;
  if (elapsed >= 0.5) {
    stepsPerSecond = (stepCount - rateSampleSteps) / elapsed;
    rateSampleSteps = stepCount;
    rateSampleMillis = now;
  }
}

// ----- static scenery (cached): city blocks, roads, markings -----

function paintBackdrop(g, w, h, geometry) {
  const key = [canvas.width, canvas.height, view.scale, view.ratio, T.version,
    geometry.cx, geometry.cy, geometry.ppm].join('|');
  if (!backdrop || backdropKey !== key) {
    backdrop = buildBackdrop(w, h, geometry);
    backdropKey = key;
  }
  g.drawImage(backdrop, 0, 0, w, h);
}

function buildBackdrop(w, h, { cx, cy, ppm }) {
  const image = document.createElement('canvas');
  image.width = canvas.width;
  image.height = canvas.height;
  const g = image.getContext('2d');
  const k = view.ratio * view.scale;
  g.setTransform(k, 0, 0, k, 0, 0);

  // Ground
  g.fillStyle = linear(g, 0, 0, rgba(T.BG_TOP), 0, h, rgba(T.BG_MID));
  g.fillRect(0, 0, w, h);
  paintGlow(g, w * 0.2, h * 0.15, w * 0.4, T.VIOLET, T.dark ? 40 : 30);
  paintGlow(g, w * 0.85, h * 0.8, w * 0.35, T.PINK, T.dark ? 22 : 18);

  const road = ROAD_HALF * ppm;
  const walk = road + 3 * ppm;

  // City blocks with rooftops, in the four corners
  const random = seededRandom(11);
  const blocks = [
    [0, 0, cx - walk, cy - walk], [cx + walk, 0, w, cy - walk],
    [0, cy + walk, cx - walk, h], [cx + walk, cy + walk, w, h],
  ];
  for (const [x0, y0, x1, y1] of blocks) {
    if (x1 - x0 < 4 || y1 - y0 < 4) continue;
    g.fillStyle = rgba(T.SIDEWALK);
    g.fillRect(x0, y0, x1 - x0, y1 - y0);
    const inset = 2.5 * ppm;
    const bx0 = x0 === 0 ? -inset : x0 + inset;
    const by0 = y0 === 0 ? -inset : y0 + inset;
    const bx1 = x1 === w ? w + inset : x1 - inset;
    const by1 = y1 === h ? h + inset : y1 - inset;
    roundRectPath(g, bx0, by0, bx1 - bx0, by1 - by0, 3 * ppm);
    g.fillStyle = rgba(T.BLOCK);
    g.fill();
    paintBuildings(g, bx0, by0, bx1, by1, ppm, random);
    paintTrees(g, x0, y0, x1, y1, cx, cy, walk, ppm, random);
  }

  // Asphalt
  g.fillStyle = rgba(T.ASPHALT);
  g.fillRect(0, cy - road, w, 2 * road);
  g.fillRect(cx - road, 0, 2 * road, h);
  // Curbs
  setStroke(g, 1.2, false);
  g.strokeStyle = rgba(T.INK, T.dark ? 30 : 60);
  for (const s of [-1, 1]) {
    strokeLine(g, 0, cy + s * road, cx - road, cy + s * road);
    strokeLine(g, cx + road, cy + s * road, w, cy + s * road);
    strokeLine(g, cx + s * road, 0, cx + s * road, cy - road);
    strokeLine(g, cx + s * road, cy + road, cx + s * road, h);
  }

  // Center lines: double yellow, from the stop lines outwards
  const stop = STOP_FROM_CENTER * ppm;
  g.strokeStyle = rgba(T.AMBER, T.dark ? 150 : 220);
  setStroke(g, 1.2, false);
  for (const offset of [-1.6, 1.6]) {
    strokeLine(g, 0, cy + offset, cx - stop, cy + offset);
    strokeLine(g, cx + stop, cy + offset, w, cy + offset);
    strokeLine(g, cx + offset, 0, cx + offset, cy - stop);
    strokeLine(g, cx + offset, cy + stop, cx + offset, h);
  }

  // Crosswalks (zebra) between the box and the stop lines
  const marking = rgba(T.MARKING, T.dark ? 70 : 200);
  g.fillStyle = marking;
  const stripe = 0.5 * ppm;
  const near = (ROAD_HALF + 0.8) * ppm;
  const far = (STOP_FROM_CENTER - 1) * ppm;
  for (let s = -road + stripe * 0.6; s < road - stripe * 0.5; s += stripe * 2) {
    g.fillRect(cx + s, cy - far, stripe, far - near);        // north
    g.fillRect(cx + s, cy + near, stripe, far - near);       // south
    g.fillRect(cx - far, cy + s, far - near, stripe);        // west
    g.fillRect(cx + near, cy + s, far - near, stripe);       // east
  }

  // Stop lines, only across the lane that arrives
  g.fillStyle = rgba(T.MARKING, T.dark ? 170 : 255);
  const line = Math.max(2, 0.45 * ppm);
  g.fillRect(cx - road, cy - stop - line / 2, road, line);    // from the north (west half)
  g.fillRect(cx, cy + stop - line / 2, road, line);           // from the south (east half)
  g.fillRect(cx - stop - line / 2, cy, line, road);           // from the west (south half)
  g.fillRect(cx + stop - line / 2, cy - road, line, road);    // from the east (north half)

  // Arrows painted on each approach lane
  g.fillStyle = rgba(T.MARKING, T.dark ? 45 : 140);
  for (let i = 0; i < 4; i++) {
    const p = worldPoint(i, STOP_S - 14, cx, cy, ppm);
    paintLaneArrow(g, p.x, p.y, p.angle, ppm);
  }

  // Vignette
  const radius = Math.max(w, h) * 0.78;
  g.fillStyle = radial(g, w / 2, h / 2, radius,
      [[0.55, 'rgba(0,0,0,0)'], [1, `rgba(0,0,0,${(T.dark ? 150 : 40) / 255})`]]);
  g.fillRect(0, 0, w, h);
  return image;
}

function paintGlow(g, cx, cy, radius, color, alpha) {
  g.fillStyle = radial(g, cx, cy, radius, [[0, rgba(color, alpha)], [1, rgba(color, 0)]]);
  circlePath(g, cx, cy, radius);
  g.fill();
}

/** Rooftops seen from above, packed in rows inside a block. */
function paintBuildings(g, x0, y0, x1, y1, ppm, random) {
  const gap = 1.6 * ppm;
  const tints = [T.VIOLET, T.CYAN, T.TEAL, T.PINK];
  let y = y0 + gap;
  while (y < y1 - gap * 2) {
    const rowH = (9 + random() * 10) * ppm;
    let x = x0 + gap;
    const bottom = Math.min(y + rowH, y1 - gap);
    while (x < x1 - gap * 2) {
      const bw = (8 + random() * 14) * ppm;
      const right = Math.min(x + bw, x1 - gap);
      if (right - x > 3 * ppm && bottom - y > 3 * ppm) {
        const tint = tints[Math.floor(random() * tints.length)];
        const roof = mix(T.ROOF, tint, T.dark ? 0.06 + random() * 0.1 : 0.05 + random() * 0.08);
        // Shadow, roof, top light
        roundRectPath(g, x + 0.8 * ppm, y + 0.8 * ppm, right - x, bottom - y, ppm);
        g.fillStyle = `rgba(0,0,0,${T.dark ? 0.35 : 0.12})`;
        g.fill();
        roundRectPath(g, x, y, right - x, bottom - y, ppm);
        g.fillStyle = linear(g, x, y, rgba(mix(roof, WHITE, T.dark ? 0.06 : 0.25)), right, bottom, rgba(roof));
        g.fill();
        setStroke(g, 1, false);
        g.strokeStyle = rgba(T.INK, T.dark ? 16 : 30);
        g.stroke();
        // A rooftop unit or a lit skylight
        if (random() < 0.6) {
          const ux = x + (right - x) * (0.2 + random() * 0.5);
          const uy = y + (bottom - y) * (0.2 + random() * 0.5);
          const size = (1.5 + random() * 2) * ppm;
          roundRectPath(g, ux, uy, size, size * 0.8, ppm * 0.5);
          g.fillStyle = T.dark && random() < 0.5 ? rgba(T.AMBER, 70) : rgba(T.INK, T.dark ? 22 : 30);
          g.fill();
        }
      }
      x = right + gap;
    }
    y = bottom + gap;
  }
}

/** Trees along the sidewalks next to the roads. */
function paintTrees(g, x0, y0, x1, y1, cx, cy, walk, ppm, random) {
  const spacing = 11 * ppm;
  const r = 1.6 * ppm;
  const tree = (x, y) => {
    if (x < x0 + r || x > x1 - r || y < y0 + r || y > y1 - r) return;
    fillCircle(g, x + 0.5 * ppm, y + 0.6 * ppm, r, `rgba(0,0,0,${T.dark ? 0.3 : 0.12})`);
    fillCircle(g, x, y, r * (0.85 + random() * 0.3), rgba(mix(T.GREEN, T.BLOCK, T.dark ? 0.55 : 0.25)));
    fillCircle(g, x - r * 0.3, y - r * 0.3, r * 0.45, rgba(mix(T.GREEN, WHITE, 0.2), T.dark ? 50 : 90));
  };
  const along = 1.4 * ppm;
  const horizontalY = y0 < cy ? y1 - along : y0 + along;
  const verticalX = x0 < cx ? x1 - along : x0 + along;
  for (let x = cx - walk - spacing; x > 0; x -= spacing) tree(x, horizontalY);
  for (let x = cx + walk + spacing; x < view.W; x += spacing) tree(x, horizontalY);
  for (let y = cy - walk - spacing; y > 0; y -= spacing) tree(verticalX, y);
  for (let y = cy + walk + spacing; y < view.H; y += spacing) tree(verticalX, y);
}

function paintLaneArrow(g, x, y, angle, ppm) {
  g.save();
  g.translate(x, y);
  g.rotate(angle);
  const len = 4 * ppm;
  g.fillRect(-len / 2, -0.25 * ppm, len * 0.6, 0.5 * ppm);
  g.beginPath();
  g.moveTo(len / 2, 0);
  g.lineTo(len * 0.1, -0.9 * ppm);
  g.lineTo(len * 0.1, 0.9 * ppm);
  g.closePath();
  g.fill();
  g.restore();
}

/**
 * Screen point of a position s along an approach lane (right-hand traffic), plus the heading.
 * Cars from the north drive down on the west half, from the south up on the east half, and so on.
 */
function worldPoint(approach, s, cx, cy, ppm) {
  const d = s - (STOP_S + STOP_FROM_CENTER);   // negative before the center of the box
  const lane = LANE_W / 2;
  let x;
  let y;
  let angle;
  switch (APPROACHES[approach].id) {
    case 'N': x = -lane; y = d; angle = Math.PI / 2; break;
    case 'S': x = lane; y = -d; angle = -Math.PI / 2; break;
    case 'W': x = d; y = lane; angle = 0; break;
    default: x = -d; y = -lane; angle = Math.PI; break;
  }
  return { x: cx + x * ppm, y: cy + y * ppm, angle };
}

// ----- cars -----

function carColor(index) {
  return [T.CYAN, T.VIOLET, T.PINK, T.TEAL, T.AMBER, T.SILVER][index];
}

function paintCars(g, { cx, cy, ppm }) {
  const lanes = model.main.lanes;
  const length = CAR_LENGTH * ppm;
  const width = 1.9 * ppm;
  // Headlight beams first, so they stay under every car.
  if (T.dark) {
    for (let i = 0; i < lanes.length; i++) {
      for (const car of lanes[i].cars) {
        const p = worldPoint(i, car.s, cx, cy, ppm);
        if (!onScreen(p, length * 3)) continue;
        g.save();
        g.translate(p.x, p.y);
        g.rotate(p.angle);
        const beam = 7 * ppm;
        g.fillStyle = linear(g, 0, 0, 'rgba(255,240,200,0.16)', beam, 0, 'rgba(255,240,200,0)');
        g.beginPath();
        g.moveTo(0, -width * 0.35);
        g.lineTo(beam, -width * 0.9);
        g.lineTo(beam, width * 0.9);
        g.lineTo(0, width * 0.35);
        g.closePath();
        g.fill();
        g.restore();
      }
    }
  }
  for (let i = 0; i < lanes.length; i++) {
    for (const car of lanes[i].cars) {
      const p = worldPoint(i, car.s, cx, cy, ppm);
      if (!onScreen(p, length * 2)) continue;
      paintCar(g, p, car, length, width, ppm);
    }
  }
}

function onScreen(p, margin) {
  return p.x > -margin && p.x < view.W + margin && p.y > -margin && p.y < view.H + margin;
}

/** One car seen from above; the front bumper is at p. */
function paintCar(g, p, car, length, width, ppm) {
  const color = carColor(car.color);
  g.save();
  g.translate(p.x, p.y);
  g.rotate(p.angle);
  // Shadow and body
  roundRectPath(g, -length + 0.4 * ppm, -width / 2 + 0.5 * ppm, length, width, width * 0.55);
  g.fillStyle = `rgba(0,0,0,${T.dark ? 0.4 : 0.18})`;
  g.fill();
  roundRectPath(g, -length, -width / 2, length, width, width * 0.55);
  g.fillStyle = linear(g, 0, -width / 2, rgba(mix(color, WHITE, 0.22)), 0, width / 2, rgba(mix(color, BLACK, 0.25)));
  g.fill();
  // Cabin glass
  const glass = rgba(T.dark ? hex(0x0A0F22) : hex(0x1C2436), 200);
  roundRectPath(g, -length * 0.7, -width * 0.36, length * 0.48, width * 0.72, width * 0.3);
  g.fillStyle = glass;
  g.fill();
  roundRectPath(g, -length * 0.62, -width * 0.3, length * 0.3, width * 0.6, width * 0.2);
  g.fillStyle = rgba(mix(color, WHITE, 0.15));
  g.fill();
  // Headlights and brake lights
  const lamp = Math.max(1, 0.32 * ppm);
  g.fillStyle = T.dark ? 'rgba(255,246,214,0.95)' : 'rgba(255,255,255,0.9)';
  g.fillRect(-lamp * 1.2, -width / 2 + lamp * 0.5, lamp, lamp * 1.4);
  g.fillRect(-lamp * 1.2, width / 2 - lamp * 1.9, lamp, lamp * 1.4);
  const braking = car.a < -0.8 || (!car.crossed && car.v < 0.5);
  if (braking) {
    const glow = car.a < -0.8 ? 1 : 0.8;
    g.fillStyle = `rgba(255,60,70,${glow})`;
    g.fillRect(-length + lamp * 0.2, -width / 2 + lamp * 0.5, lamp, lamp * 1.4);
    g.fillRect(-length + lamp * 0.2, width / 2 - lamp * 1.9, lamp, lamp * 1.4);
    if (T.dark) {
      g.fillStyle = radial(g, -length, 0, width, [[0, 'rgba(255,60,70,0.35)'], [1, 'rgba(255,60,70,0)']]);
      circlePath(g, -length, 0, width);
      g.fill();
    }
  } else {
    g.fillStyle = 'rgba(160,30,40,0.8)';
    g.fillRect(-length + lamp * 0.2, -width / 2 + lamp * 0.5, lamp * 0.8, lamp * 1.4);
    g.fillRect(-length + lamp * 0.2, width / 2 - lamp * 1.9, lamp * 0.8, lamp * 1.4);
  }
  g.restore();
}

// ----- traffic lights -----

/** Where each approach's light stands: at the near right corner, before the stop line. */
function lightPlacement(approach, { cx, cy, ppm }) {
  const side = (ROAD_HALF + 2.2) * ppm;
  const along = (STOP_FROM_CENTER + 1.5) * ppm;
  switch (APPROACHES[approach].id) {
    case 'N': return { x: cx - side, y: cy - along, vertical: true, outward: [-1, 0] };
    case 'S': return { x: cx + side, y: cy + along, vertical: true, outward: [1, 0] };
    case 'W': return { x: cx - along, y: cy + side, vertical: false, outward: [0, 1] };
    default: return { x: cx + along, y: cy - side, vertical: false, outward: [0, -1] };
  }
}

function lampColor(light) {
  return light === 'G' ? T.GREEN : light === 'Y' ? T.AMBER : T.ROSE;
}

function paintLights(g, geometry, now) {
  const r = Math.max(ui(4.4), 0.78 * geometry.ppm); // the lights grow with the zoom
  const main = model.main;
  const waiting = waitingPerApproach(main);
  for (let i = 0; i < APPROACHES.length; i++) {
    const light = main.light(i);
    const place = lightPlacement(i, geometry);
    const long = 6 * r + 10;
    const short = 2 * r + 8;
    const w = place.vertical ? short : long;
    const h = place.vertical ? long : short;
    const x = place.x - w / 2;
    const y = place.y - h / 2;
    // Glow of the lit lamp on the ground
    const order = ['R', 'Y', 'G'];
    const lit = order.indexOf(light);
    const lampAt = k => (place.vertical
      ? { x: place.x, y: y + 5 + r + k * (2 * r + 0) }
      : { x: x + 5 + r + k * (2 * r + 0), y: place.y });
    const litPoint = lampAt(lit);
    const color = lampColor(light);
    if (T.dark) {
      g.fillStyle = radial(g, litPoint.x, litPoint.y, r * 5, [[0, rgba(color, 90)], [1, rgba(color, 0)]]);
      circlePath(g, litPoint.x, litPoint.y, r * 5);
      g.fill();
    }
    roundRectPath(g, x, y, w, h, short * 0.8);
    g.fillStyle = rgba(T.HOUSING, 235);
    g.fill();
    setStroke(g, hoverCrossing ? 1.6 : 1, false);
    g.strokeStyle = hoverCrossing ? rgba(T.CYAN) : rgba(T.INK, T.dark ? 50 : 90);
    g.stroke();
    for (let k = 0; k < 3; k++) {
      const p = lampAt(k);
      if (k === lit) {
        fillCircle(g, p.x, p.y, r, rgba(color));
        fillCircle(g, p.x - r * 0.3, p.y - r * 0.3, r * 0.35, 'rgba(255,255,255,0.55)');
      } else {
        fillCircle(g, p.x, p.y, r, rgba(T.LAMP_OFF));
      }
    }
    paintQueueBadge(g, place, w, h, waiting[i], color, r / ui(4.4));
  }
}

function waitingPerApproach(intersection) {
  return intersection.lanes.map(lane => {
    let n = lane.backlog.length;
    for (const car of lane.cars) if (!car.crossed && car.v < WAITING_SPEED) n++;
    return n;
  });
}

/** How many cars are waiting on that approach, next to its light. */
function paintQueueBadge(g, place, w, h, count, color, zoom) {
  setFont(g, MONO, true, 10.5 * zoom);
  const text = String(count);
  const bh = ui(18) * zoom;
  const bw = Math.max(bh, textWidth(g, text) + ui(12) * zoom);
  const [ox, oy] = place.outward;
  const bx = place.x + ox * (w / 2 + 5 + bw / 2) - bw / 2;
  const by = place.y + oy * (h / 2 + 5 + bh / 2) - bh / 2;
  roundRectPath(g, bx, by, bw, bh, bh);
  g.fillStyle = rgba(T.BG_TOP, 215);
  g.fill();
  setStroke(g, 1.2, false);
  g.strokeStyle = rgba(color, count > 0 ? 220 : 110);
  g.stroke();
  g.fillStyle = count > 0 ? rgba(T.TEXT) : rgba(T.MUTED);
  g.fillText(text, bx + (bw - textWidth(g, text)) / 2, baselineIn(g, by, bh));
}

// ----- HUD -----

function paintCard(g, x, y, w, h, title) {
  roundRectPath(g, x, y, w, h, 18);
  g.fillStyle = rgba(T.CARD);
  g.fill();
  g.fillStyle = linear(g, 0, y, 'rgba(255,255,255,0.07)', 0, y + 48, 'rgba(255,255,255,0)');
  g.fill();
  setStroke(g, 1, false);
  g.strokeStyle = rgba(T.INK, 26);
  g.stroke();

  setFont(g, SANS, true, 10.5, 0.14);
  g.fillStyle = rgba(T.MUTED);
  g.fillText(title, x + 18, y + ui(25));
  setFont(g, SANS, false, 10);
}

/** Average wait of the cars that crossed recently (current chart period, or the last bar). */
function recentDelay() {
  const main = model.main;
  if (main.delayCount >= 5 || model.log.length === 0) {
    return main.delayCount > 0 ? main.delaySum / main.delayCount : 0;
  }
  return model.log[model.log.length - 1].delay;
}

/** Cars that crossed per minute, recently (vazão). */
function recentFlow() {
  const main = model.main;
  const last = model.log[model.log.length - 1];
  if (model.periodTime < 30 && last) return last.crossed / (TrafficModel.PERIOD / 60);
  return model.periodTime > 0 ? main.delayCount / (model.periodTime / 60) : 0;
}

function paintTelemetry(g, card, now) {
  const { x, y, w, h } = card;
  paintCard(g, x, y, w, h, L.telemetry);

  const status = running ? L.running : L.paused;
  const color = running ? T.GREEN : T.MUTED;
  setFont(g, SANS, true, 10, 0.1);
  const pillW = textWidth(g, status) + ui(30);
  const pillH = ui(20);
  const pillX = x + w - 14 - pillW;
  const pillY = y + ui(10);
  roundRectPath(g, pillX, pillY, pillW, pillH, pillH);
  g.fillStyle = rgba(color, 34);
  g.fill();
  const pulse = running ? 0.5 + 0.5 * Math.sin(now * 5) : 1;
  fillCircle(g, pillX + ui(11), pillY + pillH / 2, ui(3.5), rgba(color, Math.trunc(90 + 165 * pulse)));
  g.fillStyle = rgba(color);
  g.fillText(status, pillX + ui(20), baselineIn(g, pillY, pillH));

  const main = model.main;
  const road = L.roads[main.phase];
  let phaseText;
  let phaseColor;
  if (main.stage === GREEN) {
    phaseText = L.phaseGreen(road, num(main.stageTime, 0) + ' s');
    phaseColor = T.GREEN;
  } else if (main.stage === YELLOW) {
    phaseText = L.phaseYellow(road);
    phaseColor = T.AMBER;
  } else {
    phaseText = L.phaseAllRed;
    phaseColor = T.ROSE;
  }
  const waiting = main.waitingByPhase();
  let decisionText;
  let decisionColor = T.TEXT;
  if (model.mode === FIXED) {
    const left = main.stage === GREEN ? Math.max(0, model.fixedGreen - main.stageTime) : 0;
    decisionText = L.fixedIn(num(Math.ceil(left), 0) + ' s');
  } else if (model.lastDecision) {
    const d = model.lastDecision;
    const word = d.switch ? L.change : L.keep;
    decisionText = model.mode === LEARN ? `${word} · ${num(d.probability * 100, 0)}%` : word;
    decisionColor = d.switch ? T.PINK : T.TEAL;
  } else {
    decisionText = '—';
  }
  const narrow = view.narrow;
  const rows = [
    ['◉', L.phase, phaseText, phaseColor],
    ['↕', L.queue(L.roads[NS]), L.cars(waiting[NS]), T.TEXT],
    ['↔', L.queue(L.roads[EW]), L.cars(waiting[EW]), T.TEXT],
    ['d', narrow ? L.delayShort : L.delay, num(recentDelay(), 1) + ' s', T.TEXT],
    ['?', L.decision, decisionText, decisionColor],
    ['η', L.efficiency, num(efficiency(recentDelay()) * 100, 0) + '%', T.GREEN],
  ];

  // Narrow screens: two columns of three rows, so the card stays short.
  const columns = narrow ? 2 : 1;
  const perColumn = rows.length / columns;
  const columnW = (w - 36 - (columns - 1) * 24) / columns;
  rows.forEach((row, i) => {
    const column = Math.floor(i / perColumn);
    const left = x + 18 + column * (columnW + 24);
    const rowY = y + ui(58) + (i % perColumn) * ui(22);
    setFont(g, MONO, true, 13);
    g.fillStyle = rgba(T.CYAN);
    g.fillText(row[0], left, rowY);
    setFont(g, SANS, false, 12);
    g.fillStyle = rgba(T.MUTED);
    g.fillText(row[1], left + ui(22), rowY);
    setFont(g, MONO, false, 13);
    g.fillStyle = rgba(row[3]);
    drawRight(g, row[2], left + columnW, rowY);
  });

  const lineY = y + h - ui(32);
  setStroke(g, 1, false);
  g.strokeStyle = rgba(T.INK, 20);
  strokeLine(g, x + 16, lineY, x + w - 16, lineY);
  setFont(g, MONO, false, 10);
  g.fillStyle = rgba(T.MUTED);
  g.fillText(L.loop(formatClock(model.time), num(recentFlow(), 1), grouped(main.switches)),
      x + 18, y + h - ui(13));
}

function modeColor(mode) {
  return mode === LEARN ? T.CYAN : mode === EXPERT ? T.VIOLET : T.AMBER;
}

/** Wait of the controlled intersection compared with the fixed-time reference (last 10 bars). */
function comparison() {
  const recent = model.log.slice(-10);
  let delay = 0;
  let reference = 0;
  for (const entry of recent) {
    delay += entry.delay;
    reference += entry.baseline;
  }
  if (recent.length === 0 || reference <= 0) return null;
  return delay / reference - 1;
}

/** Learning card: one bar per period (average wait, lower is better) and the rule map. */
function paintLearning(g, card) {
  const { x, y, w, h } = card;
  paintCard(g, x, y, w, h, L.learningSection);
  setFont(g, SANS, true, 10.5, 0.14);
  chartToggleBounds = paintChartToggle(g, x + 18 + textWidth(g, L.learningSection) + ui(12), y + ui(10));
  const right = paintComparison(g, x + w - 14, y + ui(10));
  setFont(g, MONO, false, 10.5);
  g.fillStyle = rgba(T.MUTED);
  const titleEnd = chartToggleBounds.x + chartToggleBounds.w + ui(12);
  const header = L.periodHeader(num(TrafficModel.PERIOD / 60, 0));
  if (right - ui(12) - textWidth(g, header) >= titleEnd) drawRight(g, header, right - ui(12), y + ui(25));

  const showMap = w >= ui(380);
  const mapSize = showMap ? Math.min(h - ui(78), ui(150)) : 0;
  const chartLeft = x + ui(34);
  const chartRight = x + w - 18 - (showMap ? mapSize + ui(30) : 0);
  const chartTop = y + ui(44);
  const chartBottom = y + h - ui(40);
  paintPerformanceChart(g, chartLeft, chartTop, chartRight, chartBottom);
  paintLegend(g, chartLeft, chartRight, y + h - ui(14));
  if (showMap) paintRuleMap(g, x + w - 18 - mapSize, chartTop, mapSize);
}

/** Pill with the saving against the fixed-time plan; returns its left edge. */
function paintComparison(g, right, top) {
  const value = comparison();
  if (value === null) return right;
  let text;
  let color;
  if (chartView === 'efficiency') {
    const recent = model.log.slice(-10);
    const mean = key => recent.reduce((sum, entry) => sum + entry[key], 0) / recent.length;
    const mine = Math.round(efficiency(mean('delay')) * 100);
    const reference = Math.round(efficiency(mean('baseline')) * 100);
    text = L.efficiencyVersus(mine + '%', reference + '%');
    color = mine >= reference + 3 ? T.GREEN : mine <= reference - 3 ? T.ROSE : T.MUTED;
  } else {
    const percent = Math.round(value * 100);
    text = L.versusFixed((percent > 0 ? '+' : percent < 0 ? '−' : '') + Math.abs(percent) + '%');
    color = percent <= -5 ? T.GREEN : percent >= 5 ? T.ROSE : T.MUTED;
  }
  setFont(g, SANS, true, 10);
  const pillH = ui(20);
  const pillW = textWidth(g, text) + ui(20);
  const pillX = right - pillW;
  roundRectPath(g, pillX, top, pillW, pillH, pillH);
  g.fillStyle = rgba(color, 34);
  g.fill();
  g.fillStyle = rgba(color);
  g.fillText(text, pillX + ui(10), baselineIn(g, top, pillH));
  return pillX;
}

/** Smallest round scale (s) that fits the longest wait on the chart. */
function niceScale(longest) {
  for (const step of [10, 20, 30, 40, 60, 90, 120, 180, 300, 600, 900, 1800]) {
    if (longest <= step) return step;
  }
  return Math.ceil(longest / 1800) * 1800;
}

function toggleChartView() {
  chartView = chartView === 'efficiency' ? 'wait' : 'efficiency';
}

/** Two-option switch next to the card title: efficiency (higher is better) or wait (lower is better). */
function paintChartToggle(g, x, top) {
  setFont(g, SANS, true, 10);
  const labels = [L.viewEfficiency, L.viewWait];
  const pad = ui(9);
  const widths = labels.map(label => textWidth(g, label) + 2 * pad);
  const h = ui(20);
  const w = widths[0] + widths[1] + 4;
  roundRectPath(g, x, top, w, h, h);
  g.fillStyle = rgba(T.FIELD, 230);
  g.fill();
  if (hoverChartToggle) {
    setStroke(g, 1.2, false);
    g.strokeStyle = rgba(T.CYAN);
    g.stroke();
  }
  let cx = x + 2;
  labels.forEach((label, i) => {
    const selected = (i === 0) === (chartView === 'efficiency');
    if (selected) {
      roundRectPath(g, cx, top + 2, widths[i], h - 4, h - 4);
      g.fillStyle = rgba(i === 0 ? T.GREEN : T.CYAN, 60);
      g.fill();
    }
    g.fillStyle = selected ? rgba(T.TEXT) : rgba(T.MUTED);
    g.fillText(label, cx + pad, baselineIn(g, top, h));
    cx += widths[i];
  });
  return { x, y: top, w, h };
}

/**
 * One bar per period. Efficiency view: ideal time / real time of the cars that crossed
 * (higher is better). Wait view: their average wait (lower is better). The dashed line is
 * the fixed-time plan with exactly the same cars.
 */
function paintPerformanceChart(g, left, top, right, bottom) {
  const height = bottom - top;
  const log = model.log;
  const main = model.main;
  const showEfficiency = chartView === 'efficiency';
  const value = (delay, crossed) => {
    if (!showEfficiency) return delay;
    return crossed > 0 ? efficiency(delay) * 100 : null; // no car crossed: nothing to measure
  };
  const live = value(main.delayCount > 0 ? main.delaySum / main.delayCount : 0, main.delayCount);
  const base = model.baseline;
  const liveReference = value(base.delayCount > 0 ? base.delaySum / base.delayCount : 0, base.delayCount);

  const slots = Math.max(10, Math.trunc((right - left) / ui(5)));
  const shown = Math.min(log.length, slots - 1); // the last slot is the current period
  const first = log.length - shown;
  const slot = (right - left) / slots;
  const barW = Math.max(1.5, slot * 0.72);
  const bars = [];
  const references = [];
  for (let i = first; i < log.length; i++) {
    bars.push(value(log[i].delay, log[i].crossed));
    references.push(value(log[i].baseline, log[i].baselineCrossed));
  }

  let scale = 100;
  if (!showEfficiency) {
    let longest = Math.max(live || 0, liveReference || 0);
    for (let i = 0; i < bars.length; i++) longest = Math.max(longest, bars[i], references[i]);
    scale = niceScale(longest);
  }

  setFont(g, MONO, false, 9.5);
  setStroke(g, 1, false);
  for (let k = 0; k <= 4; k++) {
    const amount = scale * k / 4;
    const gy = bottom - k / 4 * height;
    g.strokeStyle = rgba(T.INK, k === 0 ? 40 : 14);
    strokeLine(g, left, gy, right, gy);
    g.fillStyle = rgba(T.MUTED);
    const label = k === 0 ? '0' : num(amount, 0) + (showEfficiency ? '%' : 's');
    drawRight(g, label, left - 6, gy + 3.5);
  }

  if (log.length === 0 && main.delayCount === 0) {
    setFont(g, SANS, false, 11);
    g.fillStyle = rgba(T.MUTED);
    const hint = L.emptyChart;
    if (textWidth(g, hint) <= right - left) g.fillText(hint, (left + right - textWidth(g, hint)) / 2, (top + bottom) / 2);
  }

  const yFor = amount => bottom - Math.min(amount, scale) / scale * height;
  const barHeight = amount => Math.max(2, Math.min(amount, scale) / scale * height);
  for (let i = 0; i < shown; i++) {
    if (bars[i] === null) continue;
    const barH = barHeight(bars[i]);
    const bx = left + i * slot + (slot - barW) / 2;
    roundRectPath(g, bx, bottom - barH, barW, barH, 3);
    g.fillStyle = rgba(modeColor(log[first + i].mode), 200);
    g.fill();
  }

  // Current period, still filling in
  if (live !== null) {
    const liveH = barHeight(live);
    const liveX = left + shown * slot + (slot - barW) / 2;
    const liveColor = modeColor(model.mode);
    roundRectPath(g, liveX, bottom - liveH, barW, liveH, 3);
    g.fillStyle = rgba(liveColor, 70);
    g.fill();
    setStroke(g, 1.2, false);
    g.strokeStyle = rgba(liveColor);
    g.stroke();
  }

  const polyline = (values, average) => {
    g.beginPath();
    let started = false;
    for (let i = 0; i < values.length; i++) {
      let amount = values[i];
      if (average) {
        let sum = 0;
        let count = 0;
        for (let k = Math.max(0, i - 9); k <= i; k++) {
          if (values[k] === null) continue;
          sum += Math.min(values[k], scale);
          count++;
        }
        amount = count > 0 ? sum / count : null;
      }
      if (amount === null) continue;
      const px = left + i * slot + slot / 2;
      if (!started) g.moveTo(px, yFor(amount)); else g.lineTo(px, yFor(amount));
      started = true;
    }
  };

  // The fixed-time reference with the same cars (dashed)
  if (shown >= 1) {
    polyline(references, false);
    setStroke(g, 1.6, true, [4, 4]);
    g.strokeStyle = rgba(T.ROSE, 220);
    g.stroke();
    g.setLineDash([]);
  }

  // Moving average of the last 10 bars: the learning trend
  if (shown >= 2) {
    polyline(bars, true);
    setStroke(g, 5, true);
    g.strokeStyle = rgba(T.PANEL, 160);
    g.stroke();
    setStroke(g, 2.2, true);
    g.strokeStyle = rgba(T.TEXT);
    g.stroke();
  }
}

function paintLegend(g, x, maxX, baselineY) {
  const labels = L.legend;
  const colors = [T.CYAN, T.VIOLET, T.AMBER, T.ROSE, T.TEXT];
  setFont(g, SANS, false, 9.5);
  let cx = x;
  for (let i = 0; i < labels.length; i++) {
    const labelW = textWidth(g, labels[i]);
    if (cx + 16 + labelW > maxX) break; // no room left next to the rule map
    if (i === 3) {
      setStroke(g, 1.6, true, [3, 3]);
      g.strokeStyle = rgba(colors[i]);
      strokeLine(g, cx, baselineY - 4, cx + 12, baselineY - 4);
      g.setLineDash([]);
    } else if (i === 4) {
      setStroke(g, 2.2, true);
      g.strokeStyle = rgba(colors[i]);
      strokeLine(g, cx, baselineY - 4, cx + 12, baselineY - 4);
    } else {
      roundRectPath(g, cx + 2, baselineY - 9, 8, 9, 2);
      g.fillStyle = rgba(colors[i]);
      g.fill();
    }
    g.fillStyle = rgba(T.MUTED);
    g.fillText(labels[i], cx + 16, baselineY);
    cx += 16 + labelW + ui(10);
  }
}

/**
 * Map of the fuzzy rule base for the current length of the green: cars on the green road
 * (horizontal) against cars on the red road (vertical). Pink means "switch", teal "keep the
 * green"; the learner's map starts blank and fills in as it learns.
 */
function paintRuleMap(g, x, y, size) {
  const cells = 24;
  const cell = size / cells;
  const urgencies = model.ruleUrgencies();
  const maxCars = FuzzyRules.QUEUE_CENTERS[FuzzyRules.QUEUE_CENTERS.length - 1];
  const main = model.main;
  const greenTime = main.stage === GREEN ? main.stageTime : MIN_GREEN;
  const state = [0, 0, greenTime];
  for (let i = 0; i < cells; i++) {
    for (let j = 0; j < cells; j++) {
      state[0] = (i + 0.5) / cells * maxCars;
      state[1] = (1 - (j + 0.5) / cells) * maxCars;
      const u = FuzzyRules.infer(urgencies, state, heatmapPhi);
      const intensity = Math.min(1, Math.abs(u) / 4);
      g.fillStyle = rgba(mix(T.FIELD, u >= 0 ? T.PINK : T.TEAL, intensity));
      g.fillRect(x + i * cell, y + j * cell, cell + 0.6, cell + 0.6);
    }
  }
  setStroke(g, 1, false);
  g.strokeStyle = rgba(T.INK, 40);
  strokeLine(g, x, y + size, x + size, y);   // diagonal: as many cars on both roads
  g.strokeStyle = rgba(T.INK, 60);
  g.strokeRect(x, y, size, size);

  // Where the intersection is right now
  const [green, red] = main.queues();
  const nx = Math.min(1, green / maxCars);
  const ny = Math.min(1, red / maxCars);
  const dotX = x + nx * size;
  const dotY = y + (1 - ny) * size;
  setStroke(g, 2, false);
  g.strokeStyle = rgba(T.INK, 220);
  circlePath(g, dotX, dotY, 5);
  g.stroke();
  fillCircle(g, dotX, dotY, 2, T.dark ? '#FFFFFF' : rgba(T.INK));

  setFont(g, SANS, false, 9.5);
  g.fillStyle = rgba(T.MUTED);
  g.fillText(L.mapGreen, x, y + size + ui(12));
  const titleW = textWidth(g, L.mapTitle);
  if (textWidth(g, L.mapGreen) + titleW + 8 <= size) drawRight(g, L.mapTitle, x + size, y + size + ui(12));
  g.save();
  g.translate(x - 5, y + size);
  g.rotate(-Math.PI / 2);
  g.fillText(L.mapRed, 0, 0);
  g.restore();
}

function showToast(text, color) {
  toastText = text;
  toastColor = color;
  toastStart = (performance.now() - startMillis) / 1000;
}

function paintToast(g, w, now) {
  const age = now - toastStart;
  if (!toastText || age > 1.8) return;
  const alpha = age < 1.2 ? 1 : 1 - (age - 1.2) / 0.6;
  g.save();
  g.globalAlpha = Math.max(0, alpha);
  setFont(g, SANS, true, 12);
  const pillW = textWidth(g, toastText) + ui(32);
  const pillH = ui(30);
  const pillX = (w - pillW) / 2;
  const pillY = cardsBottom() + ui(14);
  roundRectPath(g, pillX, pillY, pillW, pillH, pillH);
  g.fillStyle = rgba(T.BG_TOP, 220);
  g.fill();
  setStroke(g, 1.4, false);
  g.strokeStyle = rgba(toastColor);
  g.stroke();
  g.fillStyle = rgba(toastColor);
  g.fillText(toastText, pillX + ui(16), baselineIn(g, pillY, pillH));
  g.restore();
}

function paintFooter(g, w, h) {
  setFont(g, SANS, false, 10);
  const text = textWidth(g, L.footer) <= w - 2 * HUD_MARGIN ? L.footer : L.footerShort;
  if (textWidth(g, text) > w - 2 * HUD_MARGIN) return;
  // A soft band keeps the hint readable over the road.
  const tw = textWidth(g, text);
  roundRectPath(g, HUD_MARGIN - 8, h - 12 - ui(13), tw + 16, ui(18), ui(18));
  g.fillStyle = rgba(T.BG_TOP, 150);
  g.fill();
  g.fillStyle = rgba(T.MUTED);
  g.fillText(text, HUD_MARGIN, h - 12);
}

/** Start/pause button at the bottom left, with restart next to it. */
function paintRunButton(g) {
  setFont(g, SANS, true, 12);
  const glyph = ui(11);
  const gap = 6;
  const bw = glyph + gap + Math.max(textWidth(g, L.start), textWidth(g, L.pause)) + ui(28);
  const bh = ui(34);
  const x = HUD_MARGIN;
  const y = buttonsTop();
  const hover = hoverRunButton;
  let foreground;
  roundRectPath(g, x, y, bw, bh, 12);
  if (!running) {
    // Start: filled
    const top = hover ? mix(T.TEAL, WHITE, 0.18) : T.TEAL;
    g.fillStyle = linear(g, 0, y, rgba(top), 0, y + bh, rgba(mix(T.TEAL, BLACK, 0.28)));
    g.fill();
    if (hover) {
      setStroke(g, 1, false);
      g.strokeStyle = 'rgba(255,255,255,0.24)';
      g.stroke();
    }
    foreground = T.dark ? hex(0x041318) : WHITE;
  } else {
    // Pause: outlined in rose
    g.fillStyle = rgba(T.BG_TOP, 200);
    g.fill();
    g.fillStyle = rgba(T.ROSE, hover ? 45 : 22);
    g.fill();
    setStroke(g, 1.2, false);
    g.strokeStyle = rgba(T.ROSE, hover ? 230 : 150);
    g.stroke();
    foreground = T.dark ? mix(T.ROSE, WHITE, 0.3) : mix(T.ROSE, BLACK, 0.15);
  }

  const label = running ? L.pause : L.start;
  const startX = x + (bw - (glyph + gap + textWidth(g, label))) / 2;
  const cy = y + bh / 2;
  g.fillStyle = rgba(foreground);
  if (running) {
    const bar = glyph * 0.34;
    roundRectPath(g, startX + 0.5, cy - glyph / 2, bar, glyph, 2);
    g.fill();
    roundRectPath(g, startX + glyph - bar - 0.5, cy - glyph / 2, bar, glyph, 2);
    g.fill();
  } else {
    g.beginPath();
    g.moveTo(startX + 1, cy - glyph / 2);
    g.lineTo(startX + glyph, cy);
    g.lineTo(startX + 1, cy + glyph / 2);
    g.closePath();
    g.fill();
  }
  g.fillText(label, startX + glyph + gap, baselineIn(g, y, bh));
  runButtonBounds = { x, y, w: bw, h: bh };
  paintResetButton(g, x + bw + 8, y, bh);
}

/** Restart button: new day on the same streets, empty chart (the learner keeps what it knows). */
function paintResetButton(g, x, y, bh) {
  const label = L.restart;
  setFont(g, SANS, true, 12);
  const glyph = ui(11);
  const gap = 10; // the arrow head sticks out to the right
  const bw = glyph + gap + textWidth(g, label) + ui(28);
  const hover = hoverResetButton;
  roundRectPath(g, x, y, bw, bh, 12);
  g.fillStyle = rgba(T.BG_TOP, 200);
  g.fill();
  g.fillStyle = rgba(T.CYAN, hover ? 45 : 22);
  g.fill();
  setStroke(g, 1.2, false);
  g.strokeStyle = rgba(T.CYAN, hover ? 230 : 150);
  g.stroke();
  const foreground = rgba(T.dark ? mix(T.CYAN, WHITE, 0.3) : mix(T.CYAN, BLACK, 0.15));
  const startX = x + (bw - (glyph + gap + textWidth(g, label))) / 2;
  paintResetGlyph(g, startX + glyph / 2, y + bh / 2, glyph / 2, foreground);
  g.fillStyle = foreground;
  g.fillText(label, startX + glyph + gap, baselineIn(g, y, bh));
  resetButtonBounds = { x, y, w: bw, h: bh };
}

/** The two burst buttons at the bottom right: [north-south, east-west]. */
function burstButtons(w) {
  const k = view.narrow ? 1.5 : 1; // bigger on phones, easier to tap
  const bw = ui(48) * k;
  const bh = ui(34) * k;
  const gap = 8 * k;
  const y = buttonsTop() + ui(34) - bh; // bottoms in line with start/restart
  const right = w - HUD_MARGIN;
  return [
    { phase: NS, x: right - 2 * bw - gap, y, w: bw, h: bh, k },
    { phase: EW, x: right - bw, y, w: bw, h: bh, k },
  ];
}

function paintBurstButtons(g, w) {
  const buttons = burstButtons(w);
  const now = performance.now();
  const enabled = canInteract();
  g.save();
  if (!enabled) g.globalAlpha = 0.35; // dimmed, like a disabled button
  for (const b of buttons) {
    const pressed = pressedBurstButton === b.phase && now - pressedBurstMillis < 200;
    const hover = enabled && hoverBurstButton === b.phase;
    roundRectPath(g, b.x, b.y, b.w, b.h, 12);
    g.fillStyle = rgba(T.BG_TOP, 200);
    g.fill();
    g.fillStyle = rgba(T.AMBER, pressed ? 110 : hover ? 60 : 30);
    g.fill();
    setStroke(g, pressed || hover ? 1.6 : 1.2, false);
    g.strokeStyle = rgba(T.AMBER, pressed || hover ? 240 : 150);
    g.stroke();

    // Double arrow along the road that gets the cars
    const cx = b.x + b.w / 2;
    const cy = b.y + b.h / 2;
    const half = ui(10) * b.k;
    const head = ui(5) * b.k;
    g.save();
    g.translate(cx, cy);
    if (b.phase === NS) g.rotate(Math.PI / 2);
    setStroke(g, 3 * b.k, true);
    g.strokeStyle = rgba(T.AMBER);
    strokeLine(g, -half + head, 0, half - head, 0);
    g.fillStyle = rgba(T.AMBER);
    for (const s of [-1, 1]) {
      g.beginPath();
      g.moveTo(s * half, 0);
      g.lineTo(s * (half - head * 1.4), -head);
      g.lineTo(s * (half - head * 1.4), head);
      g.closePath();
      g.fill();
    }
    g.restore();
  }
  const first = buttons[0];
  const last = buttons[1];
  setFont(g, SANS, true, 11.5);
  const text = L.burst;
  const tx = (first.x + last.x + last.w - textWidth(g, text)) / 2;
  const ty = first.y - ui(8);
  g.fillStyle = rgba(T.BG_TOP, 150);
  roundRectPath(g, tx - 6, ty - ui(12), textWidth(g, text) + 12, ui(16), ui(16));
  g.fill();
  g.fillStyle = rgba(T.MUTED);
  g.fillText(text, tx, ty);
  g.restore();
}

function burstButtonAt(x, y) {
  for (const b of burstButtons(view.W)) {
    if (inside(b, x, y)) return b.phase;
  }
  return -1;
}

/** The intersection box and the four lights are one big "switch the lights" button. */
function onCrossing(x, y) {
  const { cx, cy, ppm } = crossing();
  const reach = (STOP_FROM_CENTER + 4) * ppm;
  return Math.abs(x - cx) <= reach && Math.abs(y - cy) <= reach;
}

// ----- mouse and touch interaction -----

function inside(rect, x, y) {
  return rect && x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h;
}

/** Pointer position in the scene's logical pixels. */
function scenePoint(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / view.scale, y: (e.clientY - rect.top) / view.scale };
}

function updateHover(x, y) {
  hoverBurstButton = burstButtonAt(x, y);
  hoverRunButton = inside(runButtonBounds, x, y);
  hoverResetButton = inside(resetButtonBounds, x, y);
  hoverChartToggle = inside(chartToggleBounds, x, y);
  hoverCrossing = !hoverRunButton && !hoverResetButton && hoverBurstButton < 0 && !hoverChartToggle
      && canInteract() && onCrossing(x, y);
  const clickable = hoverRunButton || hoverResetButton || hoverCrossing || hoverChartToggle
      || (hoverBurstButton >= 0 && canInteract());
  canvas.style.cursor = clickable ? 'pointer' : 'default';
}

canvas.addEventListener('pointerdown', e => {
  canvas.focus({ preventScroll: true });
  if (e.button !== 0) return;
  const p = scenePoint(e);
  const burst = burstButtonAt(p.x, p.y);
  if (burst >= 0) {
    sendBurst(burst);
    return;
  }
  if (inside(chartToggleBounds, p.x, p.y)) {
    toggleChartView();
    return;
  }
  if (inside(runButtonBounds, p.x, p.y)) {
    toggleSimulation();
    hoverRunButton = true;
    return;
  }
  if (inside(resetButtonBounds, p.x, p.y)) {
    model.restartAndClearChart();
    return;
  }
  if (onCrossing(p.x, p.y)) switchByHand();
});

canvas.addEventListener('pointermove', e => {
  const p = scenePoint(e);
  updateHover(p.x, p.y);
});

canvas.addEventListener('pointerleave', () => {
  hoverBurstButton = -1;
  hoverRunButton = false;
  hoverResetButton = false;
  hoverCrossing = false;
  hoverChartToggle = false;
  canvas.style.cursor = 'default';
});

// ---------------------------------------------------------------------------
// Startup
// ---------------------------------------------------------------------------

/** Copies every slider value into the model (used once, at startup). */
function applySettings() {
  speed = speedInput.getValue();
  model.learningRate = learningRateInput.getValue();
  model.exploration = explorationInput.getValue();
  model.fixedGreen = fixedGreenInput.getValue();
  model.flow[NS] = flowNSInput.getValue();
  model.flow[EW] = flowEWInput.getValue();
  model.variation = variationInput.getValue() / 100;
  model.restartAndClearChart();
}

/** Small screens: the header goes above the scene; wide screens: back on top of the sidebar. */
function placeHeader() {
  const header = document.querySelector('.header');
  const app = document.getElementById('app');
  const sidebar = document.getElementById('sidebar');
  if (window.matchMedia('(max-width: 999px)').matches) {
    if (header.parentElement !== app) app.insertBefore(header, app.firstChild);
  } else if (header.parentElement !== sidebar) {
    sidebar.insertBefore(header, sidebar.firstChild);
  }
}

/** Small screens: the speed slider goes right below the scene; wide screens: back in the sidebar. */
function placeSpeedSlider() {
  const bar = document.getElementById('speedBar');
  const slot = document.getElementById('learningSlot');
  if (window.matchMedia('(max-width: 999px)').matches) {
    if (speedInput.element.parentElement !== bar) bar.appendChild(speedInput.element);
  } else if (speedInput.element.parentElement !== slot) {
    slot.insertBefore(speedInput.element, slot.firstChild);
  }
  speedInput.paint();
}

applyLanguage();
placeHeader();
buildSidebar();
placeSpeedSlider();
window.matchMedia('(max-width: 999px)').addEventListener('change', () => {
  placeHeader();
  placeSpeedSlider();
});
applyTheme(loadDarkTheme());
applySettings();
// Sliders are drawn at their real width once the layout exists (and again on resize).
const repaintSliders = new ResizeObserver(() => allSliders.forEach(slider => slider.paint()));
repaintSliders.observe(document.getElementById('sidebar'));
repaintSliders.observe(document.getElementById('speedBar'));
canvas.focus({ preventScroll: true });
requestAnimationFrame(render);
</script>
</body>
</html>
