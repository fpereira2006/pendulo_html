<!doctype html>
<!--
  Pendulo4 (web version): the broomstick game.
  A port of Pendulo4.java to a single HTML file (no dependencies): same physics (RK4),
  fuzzy controller (225 rules), fuzzy actor-critic learning, expert with human reflexes,
  colors, light/dark themes, sliders, shortcuts and charts. Open it directly in a browser.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pendulo4 · Equilibrando el palo de escoba</title>
<meta name="description" content="Péndulo invertido con lógica fuzzy y aprendizaje por refuerzo.">
<style>
  :root {
    --sans: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
    --mono: "JetBrains Mono", "SF Mono", Menlo, "Cascadia Mono", Consolas, ui-monospace, monospace;
    --bg-top: #070B1A;
    --panel: #0D1327;
    --panel-border: #232C4C;
    --field: #161E3B;
    --text: #E6EAF5;
    --muted: #8A94B8;
    --cyan: #38BDF8;
    color-scheme: dark;
  }
  :root[data-theme="light"] { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg-top);
    color: var(--text);
    font-family: var(--sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  #app { display: flex; height: 100vh; height: 100dvh; }
  #stage { position: relative; flex: 1 1 auto; min-width: 0; overflow: hidden; }
  #scene { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-select: none; touch-action: manipulation; outline: none; }

  #sidebar {
    flex: 0 0 336px;
    width: 336px;
    padding: 14px 22px 14px 23px;
    background: var(--panel);
    border-left: 1px solid var(--panel-border);
    overflow-y: auto;
    user-select: none;
    -webkit-user-select: none;
  }
  .header { display: flex; align-items: flex-start; height: 67px; gap: 0; }
  .header .logo { width: 53px; height: 53px; margin-top: 4px; flex: none; }
  .header .titles { margin-left: 16px; flex: 1; min-width: 0; }
  .header h1 { margin: 0; font-size: 21px; font-weight: 700; line-height: 1; padding-top: 11px; white-space: nowrap; }
  .header .subtitle { margin-top: 10px; font-size: 14.4px; color: var(--muted); white-space: nowrap; }
  .theme-toggle { width: 29px; height: 29px; margin-top: 4px; padding: 0; border: 0; background: none; cursor: pointer; flex: none; }
  .theme-toggle canvas { display: block; width: 29px; height: 29px; }

  .section-title {
    display: flex; align-items: center; gap: 12px;
    height: 26px; margin-top: 8px; padding-top: 5px;
    font-size: 12.6px; font-weight: 700; letter-spacing: 0.14em; color: var(--muted);
  }
  .section-title::after { content: ""; flex: 1; height: 1px; background: var(--panel-border); }

  .segmented {
    display: grid; grid-template-columns: 1fr 1fr;
    height: 38px; margin-top: 6px; padding: 3px; gap: 6px;
    background: var(--field); border-radius: 6px;
  }
  .segmented button {
    border: 0; border-radius: 4.5px; cursor: pointer;
    font: 700 13.8px var(--sans); color: var(--muted); background: transparent;
  }
  .segmented button:hover { background: var(--seg-hover); }
  .segmented button.selected { background: var(--seg-accent); color: var(--seg-text); }
  .mode-description { margin-top: 6px; font-size: 12.6px; line-height: 1.3; color: var(--muted); }

  .slider { margin-top: 2px; }
  .slider.first { margin-top: 4px; }
  .slider .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .slider .name { font-size: 15.6px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slider .value { font: 700 14.4px var(--mono); white-space: nowrap; }
  .slider canvas { display: block; width: 100%; height: 23px; cursor: pointer; touch-action: none; }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    height: 48px; width: 100%; padding: 0 4px;
    border-radius: 6px; cursor: pointer;
    font: 700 14.4px var(--sans); color: var(--fg);
    white-space: nowrap; overflow: hidden;
  }
  .btn canvas { width: 15px; height: 15px; flex: none; }
  .btn.primary { border: 0; background: linear-gradient(var(--top), var(--bottom)); }
  .btn.primary:hover:not(:disabled) { background: linear-gradient(var(--top-hover), var(--bottom)); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.24); }
  .btn.primary:active:not(:disabled) { background: linear-gradient(var(--bottom-pressed), var(--top)); }
  .btn.secondary { border: 1.2px solid var(--border); background: var(--bg); }
  .btn.secondary:hover:not(:disabled) { border-color: var(--border-hover); background: var(--bg-hover); }
  .btn.secondary:active:not(:disabled) { background: var(--bg-pressed); }
  .btn:disabled { opacity: 0.35; cursor: default; }
  #btForget { margin-top: 8px; }
  .buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }

  /* Narrow windows: the scene on top, the controls below it. */
  @media (max-width: 999px) {
    body { overflow: auto; }
    #app { flex-direction: column; height: auto; }
    #stage { flex: none; height: var(--stage-height, 70vh); }
    #sidebar {
      flex: none; width: auto;
      border-left: 0; border-top: 1px solid var(--panel-border);
      padding: 14px 16px 28px;
      display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      column-gap: 32px; align-content: start; overflow: visible;
    }
    .header { grid-column: 1 / -1; }
    .group-simulation { order: 1; }
    .group-controller, .group-learning, .group-environment { order: 2; }
  }
  @media (max-width: 380px) {
    .header h1 { font-size: 18px; }
    .header .subtitle { font-size: 13px; }
  }
</style>
</head>
<body>
<div id="app">
  <main id="stage"><canvas id="scene" tabindex="0" aria-label="Simulación del péndulo invertido"></canvas></main>
  <aside id="sidebar">
    <div class="header">
      <canvas class="logo" id="logo" width="53" height="53" aria-hidden="true"></canvas>
      <div class="titles">
        <h1>Péndulo Invertido</h1>
        <div class="subtitle">fuzzy &nbsp;·&nbsp; aprendizaje &nbsp;·&nbsp; RK4</div>
      </div>
      <button class="theme-toggle" id="themeToggle" tabindex="-1"><canvas id="themeIcon" width="29" height="29"></canvas></button>
    </div>

    <section class="group-controller">
      <div class="section-title">CONTROLADOR</div>
      <div class="segmented" id="modeControl">
        <button tabindex="-1" data-index="0">Aprendiz</button>
        <button tabindex="-1" data-index="1">Experto</button>
      </div>
      <div class="mode-description" id="modeDescription"></div>
      <div id="skillSlot"></div>
    </section>

    <section class="group-learning">
      <div class="section-title">APRENDIZAJE</div>
      <div id="learningSlot"></div>
      <button class="btn secondary" id="btForget" tabindex="-1"></button>
    </section>

    <section class="group-environment">
      <div class="section-title">ENTORNO</div>
      <div id="environmentSlot"></div>
    </section>

    <section class="group-simulation">
      <div class="section-title">SIMULACIÓN</div>
      <div class="buttons">
        <button class="btn primary" id="btStart" tabindex="-1"></button>
        <button class="btn secondary" id="btStop" tabindex="-1"></button>
        <button class="btn secondary" id="btReset" tabindex="-1"></button>
      </div>
    </section>
  </aside>
</div>

<script>
'use strict';

// ---------------------------------------------------------------------------
// Constants (same values as Pendulo4.java)
// ---------------------------------------------------------------------------

const SIMULATION_TICK_MS = 4;   // like the Java thread's sleep between bursts of steps
const MAX_FORCE_NEWTONS = 10;
const TIME_STEP = 0.005;        // s
const MAX_CATCH_UP = 0.1;       // s, avoids a "spiral of death"

const PIXELS_PER_METER = 200;
const CART_W = 164;
const CART_H = 60;
const WHEEL_R = 22;
const BOB_R = 16;
const HALF_POLE_LENGTH = 0.5;   // m
const POLE_PX = 2 * HALF_POLE_LENGTH * PIXELS_PER_METER;

const MAX_FLING_CART = 5;       // m/s
const MAX_FLING_POLE = 25;      // rad/s
const STAR_COUNT = 170;
const HUD_MARGIN = 16;
const FONT_SCALE = 1.2;

const HIT_NONE = 0;
const HIT_CART = 1;
const HIT_BOB = 2;

const LEARN = 'LEARN';
const EXPERT = 'EXPERT';
const MODES = [LEARN, EXPERT];
const FELL = 'FELL';
const HIT_WALL = 'HIT_WALL';
const GOAL = 'GOAL';

/** Scales a layout size designed for 1x fonts, so cards and panels grow with the text. */
function ui(base) {
  return Math.round(base * FONT_SCALE);
}

// ---------------------------------------------------------------------------
// Formatting (Spanish: decimal comma)
// ---------------------------------------------------------------------------

function num(value, digits) {
  return value.toFixed(digits).replace('.', ',');
}

function signed(value, digits) {
  const text = num(value, digits);
  return text.startsWith('-') ? text : '+' + text;
}

function compact(value) {
  if (value < 1000) return String(value);
  if (value < 1e6) return num(value / 1e3, 1) + 'k';
  return num(value / 1e6, 1) + 'M';
}

function formatDuration(seconds, precise) {
  if (seconds < 120) return precise ? num(seconds, 1) + ' s' : num(seconds, 0) + 's';
  if (seconds < 3600) return precise ? num(seconds / 60, 1) + ' min' : num(seconds / 60, 0) + ' min';
  return num(seconds / 3600, 1) + ' h';
}

function normalizeAngle(angle) {
  return Math.atan2(Math.sin(angle), Math.cos(angle));
}

function toRadians(deg) {
  return deg * Math.PI / 180;
}

function toDegrees(rad) {
  return rad * 180 / Math.PI;
}

function gaussian() {
  let u = 0;
  while (u === 0) u = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * Math.random());
}

function randomBoolean() {
  return Math.random() < 0.5;
}

// ---------------------------------------------------------------------------
// Theme
// ---------------------------------------------------------------------------

function hex(value) {
  return [(value >> 16) & 255, (value >> 8) & 255, value & 255];
}

const WHITE = [255, 255, 255];
const BLACK = [0, 0, 0];

/** CSS color from [r, g, b] (alpha 0..255 like java.awt.Color). */
function rgba(color, alpha) {
  const a = alpha === undefined ? (color.length > 3 ? color[3] : 255) : alpha;
  return `rgba(${color[0]},${color[1]},${color[2]},${Math.max(0, Math.min(255, a)) / 255})`;
}

function mix(a, b, t) {
  const k = Math.max(0, Math.min(1, t));
  return [0, 1, 2].map(i => Math.round(a[i] + (b[i] - a[i]) * k));
}

const T = { dark: true, version: 0 };

function applyPalette(dark) {
  T.dark = dark;
  T.version++;
  T.CART_TOP = hex(0x5B7CFA);
  T.CART_BOTTOM = hex(0x26338A);
  if (dark) {
    Object.assign(T, {
      BG_TOP: hex(0x070B1A), BG_MID: hex(0x121B3D), FLOOR_TOP: hex(0x0D1430), FLOOR_BOTTOM: hex(0x04060E),
      PANEL: hex(0x0D1327), PANEL_BORDER: hex(0x232C4C), FIELD: hex(0x161E3B), CARD: [14, 20, 42, 205],
      TEXT: hex(0xE6EAF5), MUTED: hex(0x8A94B8), CYAN: hex(0x38BDF8), TEAL: hex(0x2DD4BF),
      PINK: hex(0xF472B6), VIOLET: hex(0x818CF8), AMBER: hex(0xFBBF24), ROSE: hex(0xFB7185),
      GREEN: hex(0x4ADE80), INK: WHITE, RAIL: hex(0x7DD3FC), GRID: hex(0x38BDF8),
    });
  } else {
    Object.assign(T, {
      BG_TOP: hex(0xF5F8FD), BG_MID: hex(0xDCE6F6), FLOOR_TOP: hex(0xD3DEEE), FLOOR_BOTTOM: hex(0xB4C3DB),
      PANEL: hex(0xFFFFFF), PANEL_BORDER: hex(0xD8DFEB), FIELD: hex(0xE2E8F2), CARD: [255, 255, 255, 220],
      TEXT: hex(0x1C2436), MUTED: hex(0x5E6A84), CYAN: hex(0x0284C7), TEAL: hex(0x0D9488),
      PINK: hex(0xDB2777), VIOLET: hex(0x4F46E5), AMBER: hex(0xD97706), ROSE: hex(0xE11D48),
      GREEN: hex(0x16A34A), INK: hex(0x0F172A), RAIL: hex(0x2563EB), GRID: hex(0x3B5B8C),
    });
  }
}

// The last chosen theme is remembered between runs (browser storage).
const THEME_KEY = 'pendulo4.theme';

function loadDarkTheme() {
  try {
    return localStorage.getItem(THEME_KEY) !== 'light';
  } catch (e) {
    return true;
  }
}

function saveTheme(dark) {
  try {
    localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light');
  } catch (e) {
    // Not being able to save the preference must never break the app.
  }
}

applyPalette(loadDarkTheme()); // components read the palette as soon as they are built

const SANS = getComputedStyle(document.documentElement).getPropertyValue('--sans').trim() || 'sans-serif';
const MONO = getComputedStyle(document.documentElement).getPropertyValue('--mono').trim() || 'monospace';
const HAS_LETTER_SPACING = 'letterSpacing' in CanvasRenderingContext2D.prototype;

/** Sets a canvas font; sizes are nominal (like Theme.font) and get FONT_SCALE. */
function setFont(g, family, bold, size, tracking) {
  const px = size * FONT_SCALE;
  g.font = `${bold ? 700 : 400} ${px}px ${family}`;
  if (HAS_LETTER_SPACING) g.letterSpacing = tracking ? `${tracking * px}px` : '0px';
}

// ---------------------------------------------------------------------------
// Canvas helpers
// ---------------------------------------------------------------------------

function circlePath(g, cx, cy, r) {
  g.beginPath();
  g.arc(cx, cy, Math.max(0, r), 0, Math.PI * 2);
}

function fillCircle(g, cx, cy, r, style) {
  circlePath(g, cx, cy, r);
  g.fillStyle = style;
  g.fill();
}

/** Rounded rectangle; arc is the corner diameter, as in java.awt.geom.RoundRectangle2D. */
function roundRectPath(g, x, y, w, h, arc) {
  const r = Math.max(0, Math.min(arc / 2, w / 2, h / 2));
  g.beginPath();
  g.moveTo(x + r, y);
  g.lineTo(x + w - r, y);
  g.arcTo(x + w, y, x + w, y + r, r);
  g.lineTo(x + w, y + h - r);
  g.arcTo(x + w, y + h, x + w - r, y + h, r);
  g.lineTo(x + r, y + h);
  g.arcTo(x, y + h, x, y + h - r, r);
  g.lineTo(x, y + r);
  g.arcTo(x, y, x + r, y, r);
  g.closePath();
}

function strokeLine(g, x0, y0, x1, y1) {
  g.beginPath();
  g.moveTo(x0, y0);
  g.lineTo(x1, y1);
  g.stroke();
}

function linear(g, x0, y0, c0, x1, y1, c1) {
  const gradient = g.createLinearGradient(x0, y0, x1, y1);
  gradient.addColorStop(0, c0);
  gradient.addColorStop(1, c1);
  return gradient;
}

function radial(g, cx, cy, r, stops) {
  const gradient = g.createRadialGradient(cx, cy, 0, cx, cy, Math.max(0.001, r));
  for (const [fraction, color] of stops) gradient.addColorStop(fraction, color);
  return gradient;
}

function setStroke(g, width, round, dash, dashOffset) {
  g.lineWidth = width;
  g.lineCap = round ? 'round' : 'butt';
  g.lineJoin = 'round';
  g.setLineDash(dash || []);
  g.lineDashOffset = dashOffset || 0;
}

function textWidth(g, text) {
  return g.measureText(text).width;
}

function drawRight(g, text, right, baseline) {
  g.fillText(text, right - textWidth(g, text), baseline);
}

/** Baseline that centers the current font vertically in a box (like baseline(fm, top, h)). */
function baselineIn(g, top, height) {
  const m = g.measureText('Hg');
  const ascent = m.fontBoundingBoxAscent !== undefined ? m.fontBoundingBoxAscent : m.actualBoundingBoxAscent;
  const descent = m.fontBoundingBoxDescent !== undefined ? m.fontBoundingBoxDescent : m.actualBoundingBoxDescent;
  return top + (height - (ascent + descent)) / 2 + ascent;
}

function bobColor(theta) {
  const upright = (1 + Math.cos(theta)) / 2; // 1 = upright, 0 = hanging down
  return mix(T.PINK, T.TEAL, upright);
}

function paintLogo(g, x, y, size) {
  roundRectPath(g, x, y, size, size, size * 0.32);
  g.fillStyle = linear(g, x, y, rgba(T.VIOLET), x + size, y + size, rgba(T.TEAL));
  g.fill();

  const cx = x + size * 0.45;
  const base = y + size * 0.72;
  const tipX = cx + size * 0.2;
  const tipY = y + size * 0.25;
  const white = 'rgba(255,255,255,0.94)';
  roundRectPath(g, cx - size * 0.22, base - size * 0.05, size * 0.44, size * 0.14, size * 0.08);
  g.fillStyle = white;
  g.fill();
  setStroke(g, size * 0.06, true);
  g.strokeStyle = white;
  strokeLine(g, cx, base - size * 0.03, tipX, tipY);
  fillCircle(g, tipX, tipY, size * 0.085, white);
}

/** Prepares a small canvas for crisp drawing at the screen's pixel density. */
function hiDpi(canvas, width, height) {
  const ratio = window.devicePixelRatio || 1;
  canvas.width = Math.round(width * ratio);
  canvas.height = Math.round(height * ratio);
  const g = canvas.getContext('2d');
  g.setTransform(ratio, 0, 0, ratio, 0, 0);
  g.clearRect(0, 0, width, height);
  return g;
}

// ---------------------------------------------------------------------------
// Fuzzy logic and learning
// ---------------------------------------------------------------------------

/**
 * Fuzzy partition and rule base (zero-order Takagi-Sugeno).
 * Inputs: pole angle and angular velocity (5 triangular sets each) and cart position and
 * velocity (3 sets each): 5 x 5 x 3 x 3 = 225 rules "IF ... THEN force = w".
 */
const FuzzyRules = (() => {
  const THETA_SCALE = toRadians(12); // rad
  const OMEGA_SCALE = 2.0;           // rad/s
  const X_SCALE = 2.0;               // m
  const V_SCALE = 1.5;               // m/s
  const SCALES = [THETA_SCALE, OMEGA_SCALE, X_SCALE, V_SCALE];
  const FIVE_SETS = [-1, -0.5, 0, 0.5, 1];
  const THREE_SETS = [-1, 0, 1];
  const CENTERS = [FIVE_SETS, FIVE_SETS, THREE_SETS, THREE_SETS];
  const RULES = 5 * 5 * 3 * 3;
  const MIRROR = new Int32Array(RULES);
  const EXPERT_WEIGHTS = new Float64Array(RULES);
  const mu = CENTERS.map(c => new Float64Array(c.length));

  function clampForce(force) {
    return Math.max(-MAX_FORCE_NEWTONS, Math.min(MAX_FORCE_NEWTONS, force));
  }

  // Expert rule base from control theory: F = 40 theta + 8 omega + 2 x + 4 v at each rule center.
  let r = 0;
  for (let a = 0; a < 5; a++) {
    for (let b = 0; b < 5; b++) {
      for (let c = 0; c < 3; c++) {
        for (let d = 0; d < 3; d++) {
          MIRROR[r] = (((4 - a) * 5 + (4 - b)) * 3 + (2 - c)) * 3 + (2 - d);
          const theta = FIVE_SETS[a] * THETA_SCALE;
          const omega = FIVE_SETS[b] * OMEGA_SCALE;
          const x = THREE_SETS[c] * X_SCALE;
          const v = THREE_SETS[d] * V_SCALE;
          EXPERT_WEIGHTS[r] = clampForce(40 * theta + 8 * omega + 2 * x + 4 * v);
          r++;
        }
      }
    }
  }

  /** Triangular memberships of a normalized input; they always add up to 1. */
  function memberships(u, centers, out) {
    const spacing = centers[1] - centers[0];
    const clamped = Math.max(centers[0], Math.min(centers[centers.length - 1], u));
    for (let k = 0; k < centers.length; k++) {
      out[k] = Math.max(0, 1 - Math.abs(clamped - centers[k]) / spacing);
    }
  }

  /** How strongly each rule fires for the state [theta, omega, x, v] (product AND). */
  function firing(state, phi) {
    for (let i = 0; i < 4; i++) memberships(state[i] / SCALES[i], CENTERS[i], mu[i]);
    let k = 0;
    for (let a = 0; a < 5; a++) {
      for (let b = 0; b < 5; b++) {
        const ab = mu[0][a] * mu[1][b];
        for (let c = 0; c < 3; c++) {
          const abc = ab * mu[2][c];
          for (let d = 0; d < 3; d++) phi[k++] = abc * mu[3][d];
        }
      }
    }
  }

  function dot(a, b) {
    let sum = 0;
    for (let i = 0; i < a.length; i++) sum += a[i] * b[i];
    return sum;
  }

  function infer(ruleForces, state, phi) {
    firing(state, phi);
    return dot(ruleForces, phi);
  }

  const expertPhi = new Float64Array(RULES);
  function expertForce(state) {
    return infer(EXPERT_WEIGHTS, state, expertPhi);
  }

  return {
    THETA_SCALE, OMEGA_SCALE, X_SCALE, V_SCALE, RULES, MIRROR, EXPERT_WEIGHTS,
    clampForce, firing, dot, infer, expertForce,
  };
})();

/**
 * Fuzzy actor-critic: reinforcement learning on top of the fuzzy rule base. It starts
 * knowing nothing (every rule force is 0 N) and only feels "it fell!". Mirrored rules share
 * what they learn, so a lesson on one side also works on the other.
 */
class FuzzyActorCritic {
  static GAMMA = 0.99;    // how far ahead it cares (about 2 s)
  static LAMBDA = 0.9;    // eligibility traces: credit recent decisions
  static ACTOR_RATE = 1.0;
  static CRITIC_RATE = 0.5;
  static SHAPING = 0.02;  // small penalty for leaning or leaving the center

  constructor() {
    const n = FuzzyRules.RULES;
    this.w = new Float64Array(n);  // actor: force of each rule (N)
    this.v = new Float64Array(n);  // critic: value of each rule
    this.actorTrace = new Float64Array(n);
    this.criticTrace = new Float64Array(n);
    this.phi = new Float64Array(n);
    this.previousPhi = new Float64Array(n);
    this.hasPrevious = false;
    this.previousMean = 0;
    this.previousAction = 0;
    this.recentDuration = 0;  // moving average of the attempt durations
    this.rateScale = 1;       // shrinks after successes, so good habits are kept
  }

  static reward(state) {
    const angle = state[0] / FuzzyRules.THETA_SCALE;
    const position = state[2] / FuzzyRules.X_SCALE;
    return -FuzzyActorCritic.SHAPING * (angle * angle + position * position);
  }

  /** Learns from the last decision, then chooses (and returns) the next force. */
  act(state, reward, rateMultiplier, noise) {
    FuzzyRules.firing(state, this.phi);
    if (this.hasPrevious) {
      const tdError = reward + FuzzyActorCritic.GAMMA * FuzzyRules.dot(this.v, this.phi)
          - FuzzyRules.dot(this.v, this.previousPhi);
      this.learn(tdError, rateMultiplier);
    }
    const mean = FuzzyRules.dot(this.w, this.phi);
    const action = FuzzyRules.clampForce(mean + this.currentSigma(noise) * gaussian());
    this.previousPhi.set(this.phi);
    this.previousMean = mean;
    this.previousAction = action;
    this.hasPrevious = true;
    return action;
  }

  /** Exploration noise (N): large while it keeps falling, small once it balances well. */
  currentSigma(noise) {
    return noise * Math.max(0.1, 1 - this.recentDuration / CartPoleModel.EPISODE_GOAL);
  }

  endEpisode(failed, duration, rateMultiplier) {
    if (failed && this.hasPrevious) {
      this.learn(-1 - FuzzyRules.dot(this.v, this.previousPhi), rateMultiplier); // the fall: reward -1
    }
    this.recentDuration = 0.8 * this.recentDuration + 0.2 * duration;
    this.rateScale = failed ? Math.min(1, this.rateScale * 1.05) : Math.max(0.1, this.rateScale * 0.6);
    this.startEpisode();
  }

  /** Without a goal, every goal-length stretch balanced counts as a success. */
  checkpoint(duration) {
    this.recentDuration = 0.8 * this.recentDuration + 0.2 * duration;
    this.rateScale = Math.max(0.1, this.rateScale * 0.6);
  }

  startEpisode() {
    this.actorTrace.fill(0);
    this.criticTrace.fill(0);
    this.hasPrevious = false;
  }

  learn(tdError, rateMultiplier) {
    const exploration = this.previousAction - this.previousMean;
    const actorRate = FuzzyActorCritic.ACTOR_RATE * this.rateScale * rateMultiplier;
    const criticRate = FuzzyActorCritic.CRITIC_RATE * this.rateScale * rateMultiplier;
    const decay = FuzzyActorCritic.GAMMA * FuzzyActorCritic.LAMBDA;
    const { w, v, actorTrace, criticTrace, previousPhi } = this;
    for (let i = 0; i < w.length; i++) {
      criticTrace[i] = decay * criticTrace[i] + previousPhi[i];
      actorTrace[i] = decay * actorTrace[i] + exploration * previousPhi[i];
      v[i] += criticRate * tdError * criticTrace[i];
      w[i] = FuzzyRules.clampForce(w[i] + actorRate * tdError * actorTrace[i]);
    }
    this.symmetrize();
  }

  /** The task is symmetric: mirrored rules get opposite forces and equal values. */
  symmetrize() {
    const { w, v } = this;
    for (let i = 0; i < w.length; i++) {
      const j = FuzzyRules.MIRROR[i];
      if (j < i) continue;
      const force = (w[i] - w[j]) / 2;
      const value = (v[i] + v[j]) / 2;
      w[i] = force;
      w[j] = -force;
      v[i] = value;
      v[j] = value;
    }
  }
}

// ---------------------------------------------------------------------------
// Physics model
// ---------------------------------------------------------------------------

/**
 * Cart-pole model with a controller in the loop (Barto, Sutton & Anderson 1983 dynamics,
 * with Florian 2007 corrections). theta = 0 means upright; positive theta leans right.
 */
class CartPoleModel {
  static GRAVITY = 9.81;
  static CART_FRICTION = 0.0005;
  static POLE_FRICTION = 0.000002;
  static CONTROL_PERIOD = 0.02;   // the controller decides 50 times per second
  static FAIL_ANGLE = toRadians(12);
  static EPISODE_GOAL = 120;      // s balanced = goal reached
  static PUSH_DURATION = 0.2;     // s
  static KEYBOARD_PUSH = 8;       // N
  static TREMOR = 1.2;            // N, hand tremor of the clumsiest expert
  static FALL_SHOW = 1.5;         // s the fall stays on screen before a new try
  // Height of the pivot above the rail; the pole stops when the bob's surface touches the floor.
  static PIVOT_HEIGHT = (WHEEL_R - 6 + CART_H + 16) / PIXELS_PER_METER;
  static FLOOR_ANGLE = Math.acos(
      -(CartPoleModel.PIVOT_HEIGHT - BOB_R / PIXELS_PER_METER) / (2 * HALF_POLE_LENGTH));
  static TRAIL_CAPACITY = 90;
  static SAMPLE_EVERY_STEPS = 2;  // 100 Hz with 5 ms steps
  static LOG_CAPACITY = 400;

  constructor() {
    this.trail = [];
    this.log = [];
    this.learner = new FuzzyActorCritic();
    this.x = 0;
    this.xDot = 0;
    this.theta = 0;
    this.thetaDot = 0;
    this.time = 0;
    this.cartMass = 1.1;
    this.poleMass = 0.1;
    this.force = 0;
    this.push = 0;
    this.pushTimeLeft = 0;
    this.controlClock = 0;
    this.stepsSinceSample = 0;
    this.dragging = false;
    this.perceived = new Array(8);
    this.perceivedIndex = 0;
    this.perceivedCount = 0;
    this.tremor = 0;
    this.nextCheckpoint = 0;
    this.fallLeft = 0;

    this.episode = 1;
    this.record = 0;
    this.endCounter = 0;
    this.lastEnd = null;
    this.lastEndDuration = 0;
    this.lastEndEpisode = 0;

    this.mode = LEARN;
    this.learningRate = 1;
    this.exploration = 3;
    this.initialAngle = toRadians(6);
    this.pushStrength = 3;
    this.goalEnabled = true;
    this.pushChance = 0;
    this.expertSkill = 0.4;
    this.trackHalf = 2.0;
    this.startEpisode();
  }

  setMode(mode) {
    this.mode = mode;
    this.learner.startEpisode(); // forget the last decision: another controller made it
  }

  setMasses(cartMass, poleMass) {
    this.cartMass = cartMass;
    this.poleMass = poleMass;
  }

  /** Starts a new attempt without counting the current one. */
  restartEpisode() {
    if (this.fallLeft > 0) this.episode++;
    this.startEpisode();
  }

  /** Clears the learning chart (attempts and record) and starts a new attempt. */
  restartAndClearChart() {
    this.log = [];
    this.record = 0;
    this.episode = 1;
    this.startEpisode();
  }

  /** Erases everything the learner knows and the attempt history. */
  forget() {
    this.learner = new FuzzyActorCritic();
    this.restartAndClearChart();
  }

  /** A short push on the cart, like a bump on the arm (+1 = to the right). */
  pushCart(direction, strength = CartPoleModel.KEYBOARD_PUSH) {
    this.push = direction * strength;
    this.pushTimeLeft = CartPoleModel.PUSH_DURATION;
  }

  setDragging(value) {
    this.dragging = value;
    if (value) this.trail = [];
  }

  moveCart(newX) {
    this.x = Math.max(-this.trackHalf, Math.min(this.trackHalf, newX));
    this.xDot = 0;
  }

  rotatePole(newTheta) {
    this.theta = newTheta;
    this.thetaDot = 0;
  }

  releaseCart(velocity) {
    this.xDot = velocity;
    this.dragging = false;
  }

  releasePole(angularVelocity) {
    this.thetaDot = angularVelocity;
    this.dragging = false;
  }

  /** Advances the simulation by one physics step (RK4); the controller acts every 20 ms. */
  step(dt) {
    if (this.dragging) return; // the user is holding the cart or the pole
    if (this.fallLeft > 0) {
      this.showFall(dt);
      return;
    }
    this.controlClock -= dt;
    if (this.controlClock <= 0) {
      this.controlClock += CartPoleModel.CONTROL_PERIOD;
      this.decide();
    }
    this.updatePush(dt);
    this.integrate(this.force + this.push, dt);

    this.time += dt;
    if (++this.stepsSinceSample >= CartPoleModel.SAMPLE_EVERY_STEPS) {
      this.stepsSinceSample = 0;
      this.recordSample();
    }

    if (Math.abs(normalizeAngle(this.theta)) > CartPoleModel.FAIL_ANGLE) {
      this.endEpisode(FELL);
    } else if (Math.abs(this.x) > this.trackHalf) {
      this.endEpisode(HIT_WALL);
    } else if (this.goalEnabled && this.time >= CartPoleModel.EPISODE_GOAL) {
      this.endEpisode(GOAL);
    } else if (!this.goalEnabled && this.time >= this.nextCheckpoint) {
      // No goal: the attempt goes on, but each goal-length stretch still consolidates learning.
      if (this.mode === LEARN) this.learner.checkpoint(CartPoleModel.EPISODE_GOAL);
      this.nextCheckpoint += CartPoleModel.EPISODE_GOAL;
    }
  }

  /** The controller looks at the state and chooses the force for the next 20 ms. */
  decide() {
    const state = [normalizeAngle(this.theta), this.thetaDot, this.x, this.xDot];
    if (this.mode === LEARN) {
      this.force = this.learner.act(state, FuzzyActorCritic.reward(state), this.learningRate,
          this.exploration);
    } else {
      this.force = this.humanExpertForce(state);
    }
  }

  /**
   * The expert rules applied by someone with human reflexes: they see the state a little
   * late and not exactly, correct with a lighter hand and their hand trembles.
   */
  humanExpertForce(state) {
    const clumsiness = 0.6 * (1 - this.expertSkill);
    const seen = [
      state[0] + gaussian() * clumsiness * toRadians(1.5),
      state[1] + gaussian() * clumsiness * toRadians(12),
      state[2] + gaussian() * clumsiness * 0.05,
      state[3] + gaussian() * clumsiness * 0.1];
    const size = this.perceived.length;
    this.perceived[this.perceivedIndex] = seen;
    this.perceivedIndex = (this.perceivedIndex + 1) % size;
    this.perceivedCount = Math.min(this.perceivedCount + 1, size);

    // Reaction time: up to 40 ms (2 decisions of 20 ms) for the clumsiest expert.
    const delay = Math.min(Math.round(clumsiness * 3), this.perceivedCount - 1);
    const used = this.perceived[(this.perceivedIndex - 1 - delay + size) % size];

    const gain = 0.8 + 0.2 * this.expertSkill;
    this.tremor = 0.85 * this.tremor + gaussian() * clumsiness * CartPoleModel.TREMOR;
    return FuzzyRules.clampForce(gain * FuzzyRules.expertForce(used) + this.tremor);
  }

  updatePush(dt) {
    if (this.pushTimeLeft > 0) {
      this.pushTimeLeft -= dt;
      if (this.pushTimeLeft <= 0) this.push = 0;
      return;
    }
    if (this.pushStrength <= 0 || this.pushChance <= 0) return;
    // Chance per step such that the chance within one second is pushChance.
    const perStep = 1 - Math.pow(1 - Math.min(this.pushChance, 0.999999), dt);
    if (Math.random() < perStep) {
      const direction = randomBoolean() ? 1 : -1;
      this.push = direction * this.pushStrength * (0.5 + 0.5 * Math.random());
      this.pushTimeLeft = CartPoleModel.PUSH_DURATION;
    }
  }

  endEpisode(reason) {
    if (this.mode === LEARN) {
      this.learner.endEpisode(reason !== GOAL, this.time, this.learningRate);
    }
    this.log.push({ duration: this.time, mode: this.mode, end: reason });
    if (this.log.length > CartPoleModel.LOG_CAPACITY) this.log.shift();
    this.record = Math.max(this.record, this.time);
    this.lastEnd = reason;
    this.lastEndDuration = this.time;
    this.lastEndEpisode = this.episode;
    this.endCounter++;
    if (reason === GOAL) {
      this.episode++;
      this.startEpisode();
    } else {
      // Nobody controls the cart anymore: let the pole really fall so it can be seen.
      this.fallLeft = CartPoleModel.FALL_SHOW;
      this.force = 0;
      this.push = 0;
      this.pushTimeLeft = 0;
    }
  }

  /** The pole falls freely until it lies on the floor; the cart stops at the rail ends. */
  showFall(dt) {
    this.integrate(0, dt);
    if (Math.abs(this.x) > this.trackHalf) {
      this.x = Math.sign(this.x) * this.trackHalf; // crashed into the end stop
      this.xDot = 0;
    }
    const angle = normalizeAngle(this.theta);
    if (Math.abs(angle) > CartPoleModel.FLOOR_ANGLE) {
      this.theta = Math.sign(angle) * CartPoleModel.FLOOR_ANGLE; // lying on the floor
      this.thetaDot = 0;
      this.xDot *= 0.9; // dragging the pole slows the cart down
    }
    if (++this.stepsSinceSample >= CartPoleModel.SAMPLE_EVERY_STEPS) {
      this.stepsSinceSample = 0;
      this.recordSample();
    }
    this.fallLeft -= dt;
    if (this.fallLeft <= 0) {
      this.episode++;
      this.startEpisode();
    }
  }

  /** New attempt: the pole starts near the top, leaning a little to a random side. */
  startEpisode() {
    this.fallLeft = 0;
    this.nextCheckpoint = CartPoleModel.EPISODE_GOAL;
    const side = randomBoolean() ? 1 : -1;
    this.theta = side * this.initialAngle * (0.5 + 0.5 * Math.random());
    this.thetaDot = 0;
    this.x = 0;
    this.xDot = 0;
    this.time = 0;
    this.force = 0;
    this.push = 0;
    this.pushTimeLeft = 0;
    this.controlClock = 0;
    this.stepsSinceSample = 0;
    this.trail = [];
    this.learner.startEpisode();
    this.perceivedCount = 0;
    this.tremor = 0;
  }

  integrate(appliedForce, dt) {
    const s = [this.x, this.xDot, this.theta, this.thetaDot];
    const k1 = this.derivatives(s, appliedForce);
    const k2 = this.derivatives(addScaled(s, k1, dt / 2), appliedForce);
    const k3 = this.derivatives(addScaled(s, k2, dt / 2), appliedForce);
    const k4 = this.derivatives(addScaled(s, k3, dt), appliedForce);
    for (let i = 0; i < 4; i++) s[i] += dt / 6 * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]);
    [this.x, this.xDot, this.theta, this.thetaDot] = s;
  }

  /** Returns d/dt of [x, xDot, theta, thetaDot]. */
  derivatives(s, appliedForce) {
    const xDot = s[1];
    const theta = s[2];
    const thetaDot = s[3];
    const cartMass = this.cartMass;
    const poleMass = this.poleMass;
    const totalMass = cartMass + poleMass;
    const sin = Math.sin(theta);
    const cos = Math.cos(theta);
    const cartFrictionForce = CartPoleModel.CART_FRICTION * Math.sign(xDot);

    const temp = (-appliedForce - poleMass * HALF_POLE_LENGTH * thetaDot * thetaDot * sin
        + cartFrictionForce) / totalMass;
    const thetaAcc = (CartPoleModel.GRAVITY * sin + cos * temp
        - CartPoleModel.POLE_FRICTION * thetaDot / (poleMass * HALF_POLE_LENGTH))
        / (HALF_POLE_LENGTH * (4 / 3 - poleMass * cos * cos / totalMass));
    const xAcc = (appliedForce
        + poleMass * HALF_POLE_LENGTH * (thetaDot * thetaDot * sin - thetaAcc * cos)
        - cartFrictionForce) / totalMass;
    return [xDot, xAcc, thetaDot, thetaAcc];
  }

  recordSample() {
    const poleLength = 2 * HALF_POLE_LENGTH;
    this.trail.push([this.x + poleLength * Math.sin(this.theta), poleLength * Math.cos(this.theta)]);
    if (this.trail.length > CartPoleModel.TRAIL_CAPACITY) this.trail.shift();
  }

  /** "Falling" progress: 1 right after a fall, down to 0 when the next try starts. */
  falling() {
    return this.fallLeft > 0 ? this.fallLeft / CartPoleModel.FALL_SHOW : 0;
  }

  ruleForces() {
    return this.mode === EXPERT ? FuzzyRules.EXPERT_WEIGHTS : this.learner.w;
  }
}

function addScaled(a, b, factor) {
  return [a[0] + factor * b[0], a[1] + factor * b[1], a[2] + factor * b[2], a[3] + factor * b[3]];
}

/** Half the rail length (m) that fits the scene, at most 2 m. */
function trackHalfFor(sceneWidth) {
  const halfWorld = sceneWidth / PIXELS_PER_METER / 2;
  return Math.max(0.8, Math.min(2.0, halfWorld - CART_W / 2 / PIXELS_PER_METER - 0.2));
}

// ---------------------------------------------------------------------------
// Application state and simulation loop
// ---------------------------------------------------------------------------

const model = new CartPoleModel();
let running = false;
let speed = 1;
let stepCount = 0;
let loopCount = 0;
let simTimer = null;
let lastTick = 0;
let accumulator = 0;

/**
 * Fixed time step integration that follows the wall clock, multiplied by the chosen speed
 * (at 20x, one real second simulates twenty). Runs on its own timer, apart from drawing.
 */
function simulationTick() {
  if (!running) return;
  const now = performance.now();
  accumulator += Math.min((now - lastTick) / 1000, MAX_CATCH_UP) * speed;
  lastTick = now;
  while (accumulator >= TIME_STEP) {
    model.step(TIME_STEP);
    accumulator -= TIME_STEP;
    stepCount++;
  }
  loopCount++;
  simTimer = setTimeout(simulationTick, SIMULATION_TICK_MS);
}

function startSimulation() {
  if (running) return;
  running = true;
  lastTick = performance.now();
  accumulator = 0;
  simTimer = setTimeout(simulationTick, SIMULATION_TICK_MS);
  updateButtons();
}

function stopSimulation() {
  running = false;
  clearTimeout(simTimer);
  simTimer = null;
  updateButtons();
}

function toggleSimulation() {
  if (running) stopSimulation(); else startSimulation();
}

/** Labeled slider showing its formatted value: the single input component of the sidebar. */
class ValueSlider {
  constructor(name, min, max, step, defaultValue, format, accent, dotEvery, majorEvery) {
    this.step = step;
    this.min = Math.round(min / step);
    this.max = Math.round(max / step);
    this.steps = Math.round(defaultValue / step);
    this.defaultValue = defaultValue;
    this.format = format;
    this.accent = accent;
    this.dotEvery = dotEvery;
    this.majorEvery = majorEvery;
    this.listeners = [];

    this.element = document.createElement('div');
    this.element.className = 'slider';
    this.element.innerHTML = '<div class="top"><span class="name"></span><span class="value"></span></div><canvas></canvas>';
    this.element.querySelector('.name').textContent = name;
    this.valueLabel = this.element.querySelector('.value');
    this.canvas = this.element.querySelector('canvas');
    this.canvas.setAttribute('role', 'slider');
    this.canvas.setAttribute('aria-label', name);

    const fromPointer = e => {
      const rect = this.canvas.getBoundingClientRect();
      const { left, right } = this.trackBounds(rect.width);
      const t = (e.clientX - rect.left - left) / Math.max(1, right - left);
      this.setSteps(Math.round(this.min + t * (this.max - this.min)));
    };
    this.canvas.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      this.canvas.setPointerCapture(e.pointerId);
      this.dragging = true;
      fromPointer(e);
      e.preventDefault();
    });
    this.canvas.addEventListener('pointermove', e => {
      if (this.dragging) fromPointer(e);
    });
    const end = () => { this.dragging = false; };
    this.canvas.addEventListener('pointerup', end);
    this.canvas.addEventListener('pointercancel', end);
    // The mouse wheel is left alone, so scrolling the page never changes a value.
    // Double-click restores the default value.
    this.canvas.addEventListener('dblclick', () => this.setValue(this.defaultValue));
    this.update();
  }

  trackBounds(width) {
    return { left: 11, right: width - 11 };
  }

  getValue() {
    return this.steps * this.step;
  }

  setValue(value) {
    this.setSteps(Math.round(value / this.step));
  }

  setSteps(steps) {
    const clamped = Math.max(this.min, Math.min(this.max, steps));
    if (clamped === this.steps) return;
    this.steps = clamped;
    this.update();
    for (const listener of this.listeners) listener();
  }

  onChange(action) {
    this.listeners.push(action);
  }

  update() {
    this.valueLabel.textContent = this.format(this.getValue());
    this.valueLabel.style.color = rgba(this.accent());
    this.canvas.setAttribute('aria-valuetext', this.valueLabel.textContent);
    this.paint();
  }

  paint() {
    const width = this.canvas.clientWidth;
    if (width <= 0) return;
    const height = 23;
    const g = hiDpi(this.canvas, width, height);
    const accent = this.accent();
    const cy = 11;
    const { left, right } = this.trackBounds(width);
    const xFor = v => left + (v - this.min) / Math.max(1, this.max - this.min) * (right - left);

    roundRectPath(g, left, cy - 3, right - left, 6, 6);
    g.fillStyle = rgba(T.FIELD);
    g.fill();

    // The fill starts at zero (or at the minimum), so signed values grow both ways.
    const origin = Math.max(this.min, Math.min(this.max, 0));
    const originX = xFor(origin);
    const thumbX = xFor(this.steps);
    if (Math.abs(thumbX - originX) > 1) {
      roundRectPath(g, Math.min(originX, thumbX), cy - 3, Math.abs(thumbX - originX), 6, 6);
      g.fillStyle = linear(g, originX, 0, rgba(accent, 80), thumbX, 0, rgba(accent));
      g.fill();
    }

    const low = Math.min(origin, this.steps);
    const high = Math.max(origin, this.steps);
    for (let v = this.min; v <= this.max; v++) {
      if (v % this.dotEvery !== 0) continue;
      const filled = v >= low && v <= high;
      fillCircle(g, xFor(v), cy + 9, v % this.majorEvery === 0 ? 1.8 : 1.0,
          filled ? rgba(accent, 150) : rgba(T.MUTED, 90));
    }

    fillCircle(g, thumbX, cy, 10, rgba(accent, 50));
    fillCircle(g, thumbX, cy, 7, '#F8FAFC');
    setStroke(g, 2.5, false);
    g.strokeStyle = rgba(accent);
    circlePath(g, thumbX, cy, 7);
    g.stroke();
  }
}

/** Sidebar button with a glyph, colored like Pendulo4's ModernButton. */
class ModernButton {
  constructor(element, text, glyph, accent, primary) {
    this.element = element;
    this.glyph = glyph;
    this.accent = accent;
    this.primary = primary;
    element.innerHTML = '<canvas aria-hidden="true"></canvas><span></span>';
    element.querySelector('span').textContent = text;
    this.icon = element.querySelector('canvas');
    // Like the Java buttons, they never take the keyboard focus (Space stays a shortcut).
    element.addEventListener('mousedown', e => e.preventDefault());
  }

  set enabled(value) {
    this.element.disabled = !value;
  }

  paint() {
    const accent = this.accent();
    const s = this.element.style;
    let foreground;
    if (this.primary) {
      s.setProperty('--top', rgba(accent));
      s.setProperty('--top-hover', rgba(mix(accent, WHITE, 0.18)));
      s.setProperty('--bottom', rgba(mix(accent, BLACK, 0.28)));
      s.setProperty('--bottom-pressed', rgba(mix(accent, BLACK, 0.45)));
      foreground = T.dark ? hex(0x041318) : WHITE;
    } else {
      s.setProperty('--bg', rgba(accent, 22));
      s.setProperty('--bg-hover', rgba(accent, 45));
      s.setProperty('--bg-pressed', rgba(accent, 70));
      s.setProperty('--border', rgba(accent, 150));
      s.setProperty('--border-hover', rgba(accent, 230));
      foreground = T.dark ? mix(accent, WHITE, 0.3) : mix(accent, BLACK, 0.15);
    }
    s.setProperty('--fg', rgba(foreground));

    const size = 15;
    const g = hiDpi(this.icon, size, size);
    const color = rgba(foreground);
    g.fillStyle = color;
    g.strokeStyle = color;
    const cy = size / 2;
    if (this.glyph === 'play') {
      g.beginPath();
      g.moveTo(1, cy - size / 2);
      g.lineTo(size, cy);
      g.lineTo(1, cy + size / 2);
      g.closePath();
      g.fill();
    } else if (this.glyph === 'stop') {
      roundRectPath(g, 0.5, 0.5, size - 1, size - 1, 3);
      g.fill();
    } else {
      const r = size / 2 - 1;
      const cx = size / 2;
      setStroke(g, 2, true);
      g.beginPath();
      g.arc(cx, cy, r, toRadians(-60), toRadians(-350), true);
      g.stroke();
      const a = toRadians(350);
      const ex = cx + r * Math.cos(a);
      const ey = cy - r * Math.sin(a);
      const dx = -Math.sin(a);
      const dy = -Math.cos(a);
      g.beginPath();
      g.moveTo(ex + dx * 4, ey + dy * 4);
      g.lineTo(ex - dy * 3.5, ey + dx * 3.5);
      g.lineTo(ex + dy * 3.5, ey - dx * 3.5);
      g.closePath();
      g.fill();
    }
  }
}
