<!doctype html>
<!--
  Traffic lights that learn: the same theory as the inverted pendulum (pendulo.html) applied
  to an intersection. A fuzzy rule base (75 rules) decides, every second of green, whether to
  keep the green or switch; a fuzzy actor-critic learns those rules only from how many cars are
  waiting. Cars follow the Intelligent Driver Model. A single HTML file: open it in a browser.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Traffic lights · Learning to open the green</title>
<meta name="description" content="Traffic lights with fuzzy logic and reinforcement learning.">
<style>
  :root {
    --sans: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
    --mono: "JetBrains Mono", "SF Mono", Menlo, "Cascadia Mono", Consolas, ui-monospace, monospace;
    --bg-top: #070B1A;
    --panel: #0D1327;
    --panel-border: #232C4C;
    --field: #161E3B;
    --text: #E6EAF5;
    --muted: #8A94B8;
    --cyan: #38BDF8;
    color-scheme: dark;
  }
  :root[data-theme="light"] { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg-top);
    color: var(--text);
    font-family: var(--sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  #app { display: flex; height: 100vh; height: 100dvh; }
  #stage { position: relative; flex: 1 1 auto; min-width: 0; overflow: hidden; }
  #scene { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-select: none; touch-action: manipulation; outline: none; }

  #sidebar {
    flex: 0 0 336px;
    width: 336px;
    padding: 14px 22px 14px 23px;
    background: var(--panel);
    border-left: 1px solid var(--panel-border);
    overflow-y: auto;
    user-select: none;
    -webkit-user-select: none;
  }
  .header { display: flex; align-items: flex-start; height: 67px; gap: 0; }
  .header .logo { width: 53px; height: 53px; margin-top: 4px; flex: none; }
  .header .titles { margin-left: 16px; flex: 1; min-width: 0; }
  .header h1 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1; padding-top: 11px; white-space: nowrap; }
  .header .subtitle { margin-top: 10px; font-size: 14.4px; color: var(--muted); white-space: nowrap; }
  .theme-toggle { width: 29px; height: 29px; margin-top: 4px; padding: 0; border: 0; background: none; cursor: pointer; flex: none; }
  .theme-toggle canvas { display: block; width: 29px; height: 29px; }

  .section-title {
    display: flex; align-items: center; gap: 12px;
    height: 26px; margin-top: 8px; padding-top: 5px;
    font-size: 12.6px; font-weight: 700; letter-spacing: 0.14em; color: var(--muted);
  }
  .section-title::after { content: ""; flex: 1; height: 1px; background: var(--panel-border); }

  .segmented {
    display: grid; grid-template-columns: repeat(3, 1fr);
    height: 38px; margin-top: 6px; padding: 3px; gap: 4px;
    background: var(--field); border-radius: 6px;
  }
  .segmented button {
    border: 0; border-radius: 4.5px; cursor: pointer; padding: 0 2px;
    font: 700 13px var(--sans); color: var(--muted); background: transparent;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .segmented button:hover { background: var(--seg-hover); }
  .segmented button.selected { background: var(--seg-accent); color: var(--seg-text); }
  .mode-description { margin-top: 6px; font-size: 12.6px; line-height: 1.3; color: var(--muted); }

  .slider { margin-top: 2px; }
  .slider.first { margin-top: 4px; }
  .slider .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .slider .name { font-size: 15.6px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slider .value { font: 700 14.4px var(--mono); white-space: nowrap; }
  .slider canvas { display: block; width: 100%; height: 23px; cursor: pointer; touch-action: none; }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    height: 48px; width: 100%; padding: 0 4px;
    border-radius: 6px; cursor: pointer;
    font: 700 14.4px var(--sans); color: var(--fg);
    white-space: nowrap; overflow: hidden;
  }

  .btn.secondary { border: 1.2px solid var(--border); background: var(--bg); }

    #app { flex-direction: column; height: auto; }

    #sidebar {

    }
    .header { grid-column: 1 / -1; }
    /* On small screens the header moves to the top of the page (see placeHeader). */
    #app > .header {

      padding: 6px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--panel-border);

    /* The simulation speed slider sits right below the scene (see placeSpeedSlider). */

/**
 * The language comes from the browser settings (first supported one in the user's list);
 * anything else falls back to English. "?lang=pt|es|en" in the address forces one.
 */
function pickLanguage() {
  try {
    const forced = new URLSearchParams(location.search).get('lang');
    if (forced && STRINGS[forced]) return forced;
  } catch (e) {
    // Ignore a malformed address.
  }
  const preferred = navigator.languages && navigator.languages.length
      ? navigator.languages : [navigator.language || 'en'];
  for (const tag of preferred) {
    const code = String(tag).toLowerCase().split('-')[0];
    if (STRINGS[code]) return code;
  }
  return 'en';
}

const LANG = pickLanguage();
const L = STRINGS[LANG];

/** Puts the chosen language on the static parts of the page. */
function applyLanguage() {
  document.documentElement.lang = L.htmlLang;
  document.title = L.title;
  document.querySelector('meta[name="description"]').content = L.description;
  document.getElementById('scene').setAttribute('aria-label', L.sceneLabel);
  for (const element of document.querySelectorAll('[data-i18n]')) {
    element.textContent = L[element.dataset.i18n];
  }
}

// ---------------------------------------------------------------------------
// Formatting (decimal comma in Portuguese and Spanish, point in English)
// ---------------------------------------------------------------------------

function num(value, digits) {
  return value.toFixed(digits).replace('.', L.decimal);
}

function grouped(value) {
  return String(Math.round(value)).replace(/\B(?=(\d{3})+(?!\d))/g, L.thousands);
}

function compact(value) {
  if (value < 1000) return String(value);
  if (value < 1e6) return num(value / 1e3, 1) + 'k';
  return num(value / 1e6, 1) + 'M';
}

function formatSeconds(seconds) {
  if (seconds < 100) return num(seconds, 0) + ' s';
  return num(seconds / 60, 1) + ' min';
}

function formatClock(seconds) {
  const total = Math.floor(seconds);
  const pad = n => String(n).padStart(2, '0');
  return `${pad(Math.floor(total / 3600))}:${pad(Math.floor(total / 60) % 60)}:${pad(total % 60)}`;
}

function toRadians(deg) {
  return deg * Math.PI / 180;
}

// ---------------------------------------------------------------------------
// Theme
// ---------------------------------------------------------------------------

function hex(value) {
  return [(value >> 16) & 255, (value >> 8) & 255, value & 255];
}

const WHITE = [255, 255, 255];
const BLACK = [0, 0, 0];

/** CSS color from [r, g, b] (alpha 0..255). */
function rgba(color, alpha) {
  const a = alpha === undefined ? (color.length > 3 ? color[3] : 255) : alpha;
  return `rgba(${color[0]},${color[1]},${color[2]},${Math.max(0, Math.min(255, a)) / 255})`;
}

function mix(a, b, t) {
  const k = Math.max(0, Math.min(1, t));
  return [0, 1, 2].map(i => Math.round(a[i] + (b[i] - a[i]) * k));
}

function loadDarkTheme() {
  try {
    return localStorage.getItem(THEME_KEY) !== 'light';
  } catch (e) {
    return true;
  }
}

function saveTheme(dark) {
  try {
    localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light');
  } catch (e) {
    // Not being able to save the preference must never break the app.
  }
}

applyPalette(loadDarkTheme()); // components read the palette as soon as they are built

const SANS = getComputedStyle(document.documentElement).getPropertyValue('--sans').trim() || 'sans-serif';
const MONO = getComputedStyle(document.documentElement).getPropertyValue('--mono').trim() || 'monospace';
const HAS_LETTER_SPACING = 'letterSpacing' in CanvasRenderingContext2D.prototype;

/** Sets a canvas font; sizes are nominal and get FONT_SCALE. */
function setFont(g, family, bold, size, tracking) {
  const px = size * FONT_SCALE;
  g.font = `${bold ? 700 : 400} ${px}px ${family}`;
  if (HAS_LETTER_SPACING) g.letterSpacing = tracking ? `${tracking * px}px` : '0px';
}

// ---------------------------------------------------------------------------
// Canvas helpers
// ---------------------------------------------------------------------------

function circlePath(g, cx, cy, r) {
  g.beginPath();
  g.arc(cx, cy, Math.max(0, r), 0, Math.PI * 2);
}

function fillCircle(g, cx, cy, r, style) {
  circlePath(g, cx, cy, r);
  g.fillStyle = style;
  g.fill();
}

/** Rounded rectangle; arc is the corner diameter. */
function roundRectPath(g, x, y, w, h, arc) {
  const r = Math.max(0, Math.min(arc / 2, w / 2, h / 2));
  g.beginPath();
  g.moveTo(x + r, y);
  g.lineTo(x + w - r, y);
  g.arcTo(x + w, y, x + w, y + r, r);
  g.lineTo(x + w, y + h - r);
  g.arcTo(x + w, y + h, x + w - r, y + h, r);
  g.lineTo(x + r, y + h);
  g.arcTo(x, y + h, x, y + h - r, r);
  g.lineTo(x, y + r);
  g.arcTo(x, y, x + r, y, r);
  g.closePath();
}

function strokeLine(g, x0, y0, x1, y1) {
  g.beginPath();
  g.moveTo(x0, y0);
  g.lineTo(x1, y1);
  g.stroke();
}

function linear(g, x0, y0, c0, x1, y1, c1) {
  const gradient = g.createLinearGradient(x0, y0, x1, y1);
  gradient.addColorStop(0, c0);
  gradient.addColorStop(1, c1);
  return gradient;
}

function radial(g, cx, cy, r, stops) {
  const gradient = g.createRadialGradient(cx, cy, 0, cx, cy, Math.max(0.001, r));
  for (const [fraction, color] of stops) gradient.addColorStop(fraction, color);
  return gradient;
}

function setStroke(g, width, round, dash, dashOffset) {
  g.lineWidth = width;
  g.lineCap = round ? 'round' : 'butt';
  g.lineJoin = 'round';
  g.setLineDash(dash || []);
  g.lineDashOffset = dashOffset || 0;
}

function textWidth(g, text) {
  return g.measureText(text).width;
}

function drawRight(g, text, right, baseline) {
  g.fillText(text, right - textWidth(g, text), baseline);
}

/** Baseline that centers the current font vertically in a box. */
function baselineIn(g, top, height) {
  const m = g.measureText('Hg');
  const ascent = m.fontBoundingBoxAscent !== undefined ? m.fontBoundingBoxAscent : m.actualBoundingBoxAscent;
  const descent = m.fontBoundingBoxDescent !== undefined ? m.fontBoundingBoxDescent : m.actualBoundingBoxDescent;
  return top + (height - (ascent + descent)) / 2 + ascent;
}

/** Logo: a traffic light on the same violet-to-teal tile as the pendulum. */
function paintLogo(g, x, y, size) {
  roundRectPath(g, x, y, size, size, size * 0.32);
  g.fillStyle = linear(g, x, y, rgba(T.VIOLET), x + size, y + size, rgba(T.TEAL));
  g.fill();
  const w = size * 0.34;
  const h = size * 0.7;
  const left = x + (size - w) / 2;
  const top = y + (size - h) / 2;
  roundRectPath(g, left, top, w, h, w * 0.7);
  g.fillStyle = 'rgba(255,255,255,0.94)';
  g.fill();
  const r = w * 0.27;
  const colors = ['rgba(15,23,42,0.28)', 'rgba(15,23,42,0.28)', 'rgba(22,163,74,1)'];
  for (let k = 0; k < 3; k++) fillCircle(g, x + size / 2, top + h * (0.2 + 0.3 * k), r, colors[k]);
}

/** Prepares a small canvas for crisp drawing at the screen's pixel density. */
function hiDpi(canvas, width, height) {
  const ratio = window.devicePixelRatio || 1;
  canvas.width = Math.round(width * ratio);
  canvas.height = Math.round(height * ratio);
  const g = canvas.getContext('2d');
  g.setTransform(ratio, 0, 0, ratio, 0, 0);
  g.clearRect(0, 0, width, height);
  return g;
}

// ---------------------------------------------------------------------------
// Traffic model: one intersection, four approaches, one lane each way
// ---------------------------------------------------------------------------

const TIME_STEP = 0.1;           // s
const LANE_W = 3.5;              // m
const ROAD_HALF = LANE_W;        // half the road width (one lane each way)
const STOP_FROM_CENTER = 7.5;    // m, stop line distance from the center of the box
const APPROACH = 150;            // m from the spawn point to the stop line
const STOP_S = APPROACH;         // position of the stop line along a lane
const EXIT_S = APPROACH + 2 * STOP_FROM_CENTER + 120;
const CAR_LENGTH = 4.5;          // m
const FREE_SPEED = 13.9;         // m/s (50 km/h)
const DETECTOR = 100;            // m before the stop line the controller "sees"

// Intelligent Driver Model
const IDM_ACCEL = 1.5;           // m/s²
const IDM_BRAKE = 2.0;           // m/s², comfortable
const IDM_HEADWAY = 1.2;         // s
const IDM_JAM_GAP = 2.0;         // m
const YELLOW_BRAKE = 3.5;        // m/s², the most a driver brakes for a yellow light

const YELLOW_TIME = 3;           // s
const ALL_RED_TIME = 2;          // s
const MIN_GREEN = 5;             // s
const MAX_GREEN = 90;            // s
const DECISION_PERIOD = 1;       // s, the controller decides once per second while green
const WAITING_SPEED = 1.5;       // m/s, slower than this counts as waiting
const IDEAL_TIME = STOP_S / FREE_SPEED; // s to reach the stop line with no one in the way

/**
 * Efficiency of the trip to the intersection: the ideal time divided by the real time
 * (ideal + wait). 100% = nobody ever stops; it rises as the lights learn to waste less time.
 */
function efficiency(delay) {
  return IDEAL_TIME / (IDEAL_TIME + delay);
}

const GREEN = 'GREEN';
const YELLOW = 'YELLOW';
const ALL_RED = 'ALL_RED';
const NS = 0;
const EW = 1;
// Approaches: where the cars come from. Phase NS serves N and S, phase EW serves W and E.
const APPROACHES = [
  { id: 'N', phase: NS }, { id: 'S', phase: NS }, { id: 'W', phase: EW }, { id: 'E', phase: EW },
];

const LEARN = 'LEARN';
const EXPERT = 'EXPERT';
const FIXED = 'FIXED';
const MODES = [LEARN, EXPERT, FIXED];

function gaussian() {
  let u = 0;
  while (u === 0) u = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * Math.random());
}

/** Standard normal cumulative distribution (Abramowitz-Stegun 7.1.26). */
function normalCdf(z) {
  const t = 1 / (1 + 0.3275911 * Math.abs(z) / Math.SQRT2);
  const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t
      + 0.254829592) * t * Math.exp(-z * z / 2);
  return z >= 0 ? (1 + y) / 2 : (1 - y) / 2;
}

/**
 * Fuzzy partition and rule base (zero-order Takagi-Sugeno), seen from the phase that is green:
 * cars on the green approaches, cars on the red approaches (5 sets each) and how long the
 * green has lasted (3 sets): 5 x 5 x 3 = 75 rules "IF ... THEN switch urgency = w".
 * Urgency > 0 means "switch to the other phase", < 0 means "keep the green".
 */
const FuzzyRules = (() => {
  const QUEUE_CENTERS = [0, 3, 7, 12, 20];   // cars
  const GREEN_CENTERS = [5, 20, 45];        // s of green
  const CENTERS = [QUEUE_CENTERS, QUEUE_CENTERS, GREEN_CENTERS];
  const RULES = 5 * 5 * 3;
  const MAX_URGENCY = 8;
  const EXPERT_WEIGHTS = new Float64Array(RULES);
  const mu = CENTERS.map(c => new Float64Array(c.length));

  function clampUrgency(value) {
    return Math.max(-MAX_URGENCY, Math.min(MAX_URGENCY, value));
  }

  // Expert rule base from traffic engineering: serve the bigger queue, but never cut a green
  // that still has cars flowing, and lean toward switching as the green gets long.
  let r = 0;
  for (let a = 0; a < 5; a++) {
    for (let b = 0; b < 5; b++) {
      for (let c = 0; c < 3; c++) {
        const green = QUEUE_CENTERS[a];
        const red = QUEUE_CENTERS[b];
        const elapsed = GREEN_CENTERS[c];
        EXPERT_WEIGHTS[r++] = clampUrgency(0.5 * red - 0.8 * green - 0.8 + 0.04 * (elapsed - 5));
      }
    }
  }

  /** Triangular memberships (centers may be unevenly spaced); they always add up to 1. */
  function memberships(u, centers, out) {
    const n = centers.length;
    out.fill(0);
    if (u <= centers[0]) { out[0] = 1; return; }
    if (u >= centers[n - 1]) { out[n - 1] = 1; return; }
    for (let k = 0; k < n - 1; k++) {
      if (u <= centers[k + 1]) {
        const t = (u - centers[k]) / (centers[k + 1] - centers[k]);
        out[k] = 1 - t;
        out[k + 1] = t;
        return;
      }
    }
  }

  /** How strongly each rule fires for the state [green cars, red cars, green time] (product AND). */
  function firing(state, phi) {
    for (let i = 0; i < 3; i++) memberships(state[i], CENTERS[i], mu[i]);
    let k = 0;
    for (let a = 0; a < 5; a++) {
      for (let b = 0; b < 5; b++) {
        const ab = mu[0][a] * mu[1][b];
        for (let c = 0; c < 3; c++) phi[k++] = ab * mu[2][c];
      }
    }
  }

  function dot(a, b) {
    let sum = 0;
    for (let i = 0; i < a.length; i++) sum += a[i] * b[i];
    return sum;
  }

  function infer(weights, state, phi) {
    firing(state, phi);
    return dot(weights, phi);
  }

  return { QUEUE_CENTERS, GREEN_CENTERS, RULES, MAX_URGENCY, EXPERT_WEIGHTS, clampUrgency, firing, dot, infer };
})();

/**
 * Fuzzy actor-critic for a yes/no decision. Each second of green it decides "switch or keep"
 * by adding noise to the rules' urgency; it only feels the cost of cars waiting.
 * Decisions are spaced unevenly (a switch takes yellow + all red + minimum green), so the
 * discount follows the elapsed time (semi-Markov TD learning).
 */
class FuzzyActorCritic {
  static GAMMA = 0.97;       // per second: it cares about the next half minute or so
  static LAMBDA = 0.8;
  static ACTOR_RATE = 0.6;
  static CRITIC_RATE = 0.15;

  constructor() {
    const n = FuzzyRules.RULES;
    this.w = new Float64Array(n);   // actor: switch urgency of each rule
    this.v = new Float64Array(n);   // critic: value of each rule
    this.actorTrace = new Float64Array(n);
    this.criticTrace = new Float64Array(n);
    this.phi = new Float64Array(n);
    this.previousPhi = new Float64Array(n);
    this.hasPrevious = false;
    this.previousScore = 0;
    this.lastProbability = 0;
  }

  /**
   * Learns from the previous decision (reward collected since then, already discounted, over
   * 'elapsed' seconds), then decides. Returns true to switch.
   */
  decide(state, reward, elapsed, rateMultiplier, noise, forced) {
    FuzzyRules.firing(state, this.phi);
    if (this.hasPrevious) {
      const discount = Math.pow(FuzzyActorCritic.GAMMA, elapsed);
      const tdError = reward + discount * FuzzyRules.dot(this.v, this.phi)
          - FuzzyRules.dot(this.v, this.previousPhi);
      this.learn(tdError, Math.pow(FuzzyActorCritic.LAMBDA, Math.min(elapsed, 10)) * discount, rateMultiplier);
    }
    const urgency = FuzzyRules.dot(this.w, this.phi);
    let probability;
    let choice;
    if (noise > 0) {
      probability = normalCdf(urgency / noise);
      choice = urgency + noise * gaussian() > 0;
    } else {
      choice = urgency > 0;
      probability = choice ? 1 : 0;
    }
    if (forced !== undefined) choice = forced;
    this.lastProbability = probability;
    this.previousScore = (choice ? 1 : 0) - probability;
    this.previousPhi.set(this.phi);
    this.hasPrevious = true;
    return choice;
  }

  learn(tdError, decay, rateMultiplier) {
    const actorRate = FuzzyActorCritic.ACTOR_RATE * rateMultiplier;
    const criticRate = FuzzyActorCritic.CRITIC_RATE * rateMultiplier;
    const { w, v, actorTrace, criticTrace, previousPhi, previousScore } = this;
    for (let i = 0; i < w.length; i++) {
      criticTrace[i] = decay * criticTrace[i] + previousPhi[i];
      actorTrace[i] = decay * actorTrace[i] + previousScore * previousPhi[i];
      v[i] += criticRate * tdError * criticTrace[i];
      w[i] = FuzzyRules.clampUrgency(w[i] + actorRate * tdError * actorTrace[i]);
    }
  }

  reset() {
    this.w.fill(0);
    this.v.fill(0);
    this.restart();
  }

  restart() {
    this.actorTrace.fill(0);
    this.criticTrace.fill(0);
    this.hasPrevious = false;
  }
}

/** A car on one approach lane; s is the position of its front bumper along the lane. */
class Car {
  constructor(arrival, s, v, color) {
    this.arrival = arrival;   // when it showed up (it may wait off screen before entering)
    this.s = s;
    this.v = v;
    this.a = 0;
    this.color = color;
    this.committed = false;   // decided to go through a yellow light
    this.crossed = false;
  }
}

/** One intersection with its four lanes, its lights and a controller. */
class Intersection {
  constructor() {
    this.lanes = APPROACHES.map(() => ({ cars: [], backlog: [] })); // backlog: arrived, no room yet
    this.restart();
  }

  restart() {
    for (const lane of this.lanes) {
      lane.cars.length = 0;
      lane.backlog.length = 0;
    }
    this.time = 0;
    this.phase = NS;
    this.stage = GREEN;
    this.stageTime = 0;
    this.decisionClock = 0;
    this.switches = 0;
    this.crossedCount = 0;
    this.delaySum = 0;           // of the cars that crossed, current chart period
    this.delayCount = 0;
    this.totalDelay = 0;
    this.totalCrossed = 0;
    this.waitingNow = 0;
  }

  light(approach) {
    if (APPROACHES[approach].phase !== this.phase) return 'R';
    if (this.stage === GREEN) return 'G';
    return this.stage === YELLOW ? 'Y' : 'R';
  }

  arrive(approach, color) {
    this.lanes[approach].backlog.push({ arrival: this.time, color });
  }

  /** Starts the yellow light of the current phase (if it is green). */
  requestSwitch() {
    if (this.stage !== GREEN) return false;
    this.stage = YELLOW;
    this.stageTime = 0;
    this.switches++;
    return true;
  }

  canDecide() {
    return this.stage === GREEN && this.stageTime >= MIN_GREEN;
  }

  /** Cars the controller sees: [on the green approaches, on the red approaches]. */
  queues() {
    const counts = [0, 0];
    this.lanes.forEach((lane, i) => {
      let n = lane.backlog.length;
      for (const car of lane.cars) {
        if (!car.crossed && car.s > STOP_S - DETECTOR) n++;
      }
      counts[APPROACHES[i].phase] += n;
    });
    return this.phase === NS ? counts : [counts[1], counts[0]];
  }

  /** Cars waiting per phase (for the HUD). */
  waitingByPhase() {
    const counts = [0, 0];
    this.lanes.forEach((lane, i) => {
      let n = lane.backlog.length;
      for (const car of lane.cars) if (!car.crossed && car.v < WAITING_SPEED) n++;
      counts[APPROACHES[i].phase] += n;
    });
    return counts;
  }

  step(dt) {
    this.time += dt;
    this.stageTime += dt;
    if (this.stage === YELLOW && this.stageTime >= YELLOW_TIME) {
      this.stage = ALL_RED;
      this.stageTime = 0;
    } else if (this.stage === ALL_RED && this.stageTime >= ALL_RED_TIME) {
      this.stage = GREEN;
      this.stageTime = 0;
      this.phase = 1 - this.phase;
      this.decisionClock = 0;
    }
    let waiting = 0;
    this.lanes.forEach((lane, i) => { waiting += this.stepLane(lane, this.light(i), dt); });
    this.waitingNow = waiting;
    return waiting;
  }

  stepLane(lane, light, dt) {
    const cars = lane.cars;
    // Cars that arrived enter when there is room at the start of the lane.
    if (lane.backlog.length > 0) {
      const last = cars[cars.length - 1];
      if (!last || last.s - CAR_LENGTH > IDM_JAM_GAP + 1) {
        const entry = lane.backlog.shift();
        const speed = last ? Math.min(FREE_SPEED, last.v) : FREE_SPEED;
        cars.push(new Car(entry.arrival, 0, speed, entry.color));
      }
    }
    let waiting = lane.backlog.length;
    const sqrtAB = 2 * Math.sqrt(IDM_ACCEL * IDM_BRAKE);
    for (let k = 0; k < cars.length; k++) {
      const car = cars[k];
      let gap = Infinity;
      let leaderSpeed = 0;
      if (k > 0) {
        const leader = cars[k - 1];
        gap = leader.s - CAR_LENGTH - car.s;
        leaderSpeed = leader.v;
      }
      if (!car.crossed && !car.committed && light !== 'G') {
        const toLine = STOP_S - car.s;
        // Yellow: stop if it can do so comfortably, otherwise go through.
        if (light === 'Y' && toLine < car.v * car.v / (2 * YELLOW_BRAKE)) {
          car.committed = true;
        } else if (toLine + IDM_JAM_GAP - 0.5 < gap) {
          gap = toLine + IDM_JAM_GAP - 0.5;
          leaderSpeed = 0;
        }
      }
      const desired = IDM_JAM_GAP + Math.max(0, car.v * IDM_HEADWAY + car.v * (car.v - leaderSpeed) / sqrtAB);
      const ratio = car.v / FREE_SPEED;
      let accel = IDM_ACCEL * (1 - ratio * ratio * ratio * ratio);
      if (gap < Infinity) accel -= IDM_ACCEL * (desired / Math.max(0.1, gap)) ** 2;
      accel = Math.max(-9, accel);
      const v = Math.max(0, car.v + accel * dt);
      car.s += (car.v + v) / 2 * dt;
      car.a = accel;
      car.v = v;
      if (!car.crossed) {
        if (car.s >= STOP_S) {
          car.crossed = true;
          const delay = Math.max(0, this.time - car.arrival - STOP_S / FREE_SPEED);
          this.delaySum += delay;
          this.delayCount++;
          this.totalDelay += delay;
          this.totalCrossed++;
          this.crossedCount++;
        } else if (car.v < WAITING_SPEED) {
          waiting++;
        }
      }
    }
    while (cars.length > 0 && cars[0].s > EXIT_S) cars.shift();
    return waiting;
  }
}

/**
 * The whole simulation: the controlled intersection plus a "shadow" intersection run by a
 * fixed-time plan with exactly the same cars, so the chart always has a fair reference.
 */
class TrafficModel {
  static PERIOD = 120;          // s of simulated time per chart bar
  static RUSH_PERIOD = 1800;    // s, the traffic swings between the two roads every half hour
  static REWARD_SCALE = 10;     // cars waiting per unit of penalty
  static LOG_CAPACITY = 400;
  static COLORS = 6;

  constructor() {
    this.main = new Intersection();
    this.baseline = new Intersection();
    this.learner = new FuzzyActorCritic();
    this.log = [];
    this.mode = LEARN;
    this.flow = [12, 6];        // cars per minute per approach: [north-south, east-west]
    this.variation = 0.5;
    this.fixedGreen = 30;
    this.learningRate = 1;
    this.exploration = 1;
    this.restart();
  }

  restart() {
    this.main.restart();
    this.baseline.restart();
    this.learner.restart();
    this.time = 0;
    this.periodTime = 0;
    this.resetReward();
    this.lastDecision = null;   // { switch, urgency, probability } for the HUD
  }

  restartAndClearChart() {
    this.restart();
    this.log.length = 0;
  }

  forget() {
    this.learner.reset();
    this.restartAndClearChart();
  }

  setMode(mode) {
    this.mode = mode;
    this.learner.restart();
    this.resetReward();
  }

  resetReward() {
    this.reward = 0;
    this.rewardDiscount = 1;
    this.rewardTime = 0;
  }

  /** Arrival rate (cars/s) of an approach at the current time. */
  rate(approach) {
    const phase = APPROACHES[approach].phase;
    const swing = Math.sin(2 * Math.PI * this.time / TrafficModel.RUSH_PERIOD) * this.variation;
    return this.flow[phase] / 60 * Math.max(0, phase === NS ? 1 + swing : 1 - swing);
  }

  /** A burst of cars on one road (the "push" of this simulator). */
  burst(phase, count) {
    for (let i = 0; i < APPROACHES.length; i++) {
      if (APPROACHES[i].phase !== phase) continue;
      for (let k = 0; k < count; k++) this.arriveBoth(i);
    }
  }

  arriveBoth(approach) {
    const color = Math.floor(Math.random() * TrafficModel.COLORS);
    this.main.arrive(approach, color);
    this.baseline.arrive(approach, color);
  }

  /** The user clicked the lights: switch now (counts as the learner's decision). */
  manualSwitch() {
    const main = this.main;
    if (main.stage !== GREEN || main.stageTime < 2) return false;
    if (this.mode === LEARN) this.decideLearner(true);
    return main.requestSwitch();
  }

  step(dt) {
    this.time += dt;
    for (let i = 0; i < APPROACHES.length; i++) {
      if (Math.random() < this.rate(i) * dt) this.arriveBoth(i);
    }
    const waiting = this.main.step(dt);
    this.baseline.step(dt);
    this.runFixed(this.baseline);

    const gamma = FuzzyActorCritic.GAMMA;
    this.reward += this.rewardDiscount * (-waiting / TrafficModel.REWARD_SCALE) * dt;
    this.rewardDiscount *= Math.pow(gamma, dt);
    this.rewardTime += dt;

    const main = this.main;
    if (this.mode === FIXED) {
      this.runFixed(main);
    } else if (main.stage === GREEN) {
      main.decisionClock += dt;
      if (main.stageTime >= MAX_GREEN) {
        if (this.mode === LEARN) this.decideLearner(true);
        main.requestSwitch();
      } else if (main.canDecide() && main.decisionClock >= DECISION_PERIOD) {
        main.decisionClock = 0;
        const choice = this.mode === LEARN ? this.decideLearner() : this.decideExpert();
        if (choice) main.requestSwitch();
      }
    }

    this.periodTime += dt;
    if (this.periodTime >= TrafficModel.PERIOD) this.closePeriod();
  }

  runFixed(intersection) {
    if (intersection.stage === GREEN && intersection.stageTime >= this.fixedGreen) intersection.requestSwitch();
  }

  state() {
    const [green, red] = this.main.queues();
    return [green, red, this.main.stageTime];
  }

  decideLearner(forced) {
    const state = this.state();
    const choice = this.learner.decide(state, this.reward, this.rewardTime, this.learningRate,
        this.exploration, forced);
    this.lastDecision = {
      switch: choice, urgency: FuzzyRules.dot(this.learner.w, this.learner.phi),
      probability: this.learner.lastProbability,
    };
    this.resetReward();
    return choice;
  }

  decideExpert() {
    const urgency = FuzzyRules.infer(FuzzyRules.EXPERT_WEIGHTS, this.state(), this.learner.phi);
    this.lastDecision = { switch: urgency > 0, urgency, probability: urgency > 0 ? 1 : 0 };
    return urgency > 0;
  }

  closePeriod() {
    const average = it => (it.delayCount > 0 ? it.delaySum / it.delayCount : 0);
    this.log.push({
      delay: average(this.main), baseline: average(this.baseline), mode: this.mode,
      crossed: this.main.delayCount, baselineCrossed: this.baseline.delayCount,
    });
    if (this.log.length > TrafficModel.LOG_CAPACITY) this.log.shift();
    for (const it of [this.main, this.baseline]) {
      it.delaySum = 0;
      it.delayCount = 0;
    }
    this.periodTime = 0;
  }

  ruleUrgencies() {
    return this.mode === LEARN ? this.learner.w : FuzzyRules.EXPERT_WEIGHTS;
  }
}

// ---------------------------------------------------------------------------
// Application state and simulation loop
// ---------------------------------------------------------------------------

const model = new TrafficModel();
let running = false;
let speed = 1;
let stepCount = 0;
let simTimer = null;
let lastTick = 0;
let accumulator = 0;

/**
 * Fixed time step integration that follows the wall clock, multiplied by the chosen speed
 * (at 20x, one real second simulates twenty). Runs on its own timer, apart from drawing.
 */
function simulationTick() {
  if (!running) return;
  const now = performance.now();
  accumulator += Math.min((now - lastTick) / 1000, MAX_CATCH_UP) * speed;
  lastTick = now;
  while (accumulator >= TIME_STEP) {
    model.step(TIME_STEP);
    accumulator -= TIME_STEP;
    stepCount++;
  }
  simTimer = setTimeout(simulationTick, SIMULATION_TICK_MS);
}

function startSimulation() {
  if (running) return;
  running = true;
  lastTick = performance.now();
  accumulator = 0;
  simTimer = setTimeout(simulationTick, SIMULATION_TICK_MS);
}

function stopSimulation() {
  running = false;
  clearTimeout(simTimer);
  simTimer = null;
}

function toggleSimulation() {
  if (running) stopSimulation(); else startSimulation();
}

/** Bursts and manual switches only make sense while time runs. */
function canInteract() {
  return running;
}

/** Labeled slider showing its formatted value: the single input component of the sidebar. */
class ValueSlider {
  constructor(name, min, max, step, defaultValue, format, accent, dotEvery, majorEvery) {
    this.step = step;
    this.min = Math.round(min / step);
    this.max = Math.round(max / step);
    this.steps = Math.round(defaultValue / step);
    this.defaultValue = defaultValue;
    this.format = format;
    this.accent = accent;
    this.dotEvery = dotEvery;
    this.majorEvery = majorEvery;
    this.listeners = [];

    this.element = document.createElement('div');
    this.element.className = 'slider';
    this.element.innerHTML = '<div class="top"><span class="name"></span><span class="value"></span></div><canvas></canvas>';
    this.element.querySelector('.name').textContent = name;
    this.valueLabel = this.element.querySelector('.value');
    this.canvas = this.element.querySelector('canvas');
    this.canvas.setAttribute('role', 'slider');
    this.canvas.setAttribute('aria-label', name);

    const fromPointer = e => {
      const rect = this.canvas.getBoundingClientRect();
      const { left, right } = this.trackBounds(rect.width);
      const t = (e.clientX - rect.left - left) / Math.max(1, right - left);
      this.setSteps(Math.round(this.min + t * (this.max - this.min)));
    };
    this.canvas.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      try {
        this.canvas.setPointerCapture(e.pointerId);
      } catch (err) {
        // Capture is only a convenience; the slider still works without it.
      }
      this.dragging = true;
      fromPointer(e);
      e.preventDefault();
    });
    this.canvas.addEventListener('pointermove', e => {
      if (this.dragging) fromPointer(e);
    });
    const end = () => { this.dragging = false; };
    this.canvas.addEventListener('pointerup', end);
    this.canvas.addEventListener('pointercancel', end);
    // The mouse wheel is left alone, so scrolling the page never changes a value.
    // Double-click restores the default value.
    this.canvas.addEventListener('dblclick', () => this.setValue(this.defaultValue));
    this.update();
  }

  trackBounds(width) {
    return { left: 11, right: width - 11 };
  }

  getValue() {
    return this.steps * this.step;
  }

  setValue(value) {
    this.setSteps(Math.round(value / this.step));
  }

  setSteps(steps) {
    const clamped = Math.max(this.min, Math.min(this.max, steps));
    if (clamped === this.steps) return;
    this.steps = clamped;
    this.update();
    for (const listener of this.listeners) listener();
  }

  onChange(action) {
    this.listeners.push(action);
  }

  update() {
    this.valueLabel.textContent = this.format(this.getValue());
    this.valueLabel.style.color = rgba(this.accent());
    this.canvas.setAttribute('aria-valuetext', this.valueLabel.textContent);
    this.paint();
  }

  paint() {
    const width = this.canvas.clientWidth;
    if (width <= 0) return;
    const height = 23;
    const g = hiDpi(this.canvas, width, height);
    const accent = this.accent();
    const cy = 11;
    const { left, right } = this.trackBounds(width);
    const xFor = v => left + (v - this.min) / Math.max(1, this.max - this.min) * (right - left);

    roundRectPath(g, left, cy - 3, right - left, 6, 6);
    g.fillStyle = rgba(T.FIELD);
    g.fill();

    const origin = Math.max(this.min, Math.min(this.max, 0));
    const originX = xFor(origin);
    const thumbX = xFor(this.steps);
    if (Math.abs(thumbX - originX) > 1) {
      roundRectPath(g, Math.min(originX, thumbX), cy - 3, Math.abs(thumbX - originX), 6, 6);
      g.fillStyle = linear(g, originX, 0, rgba(accent, 80), thumbX, 0, rgba(accent));
      g.fill();
    }

    const low = Math.min(origin, this.steps);
    const high = Math.max(origin, this.steps);
    for (let v = this.min; v <= this.max; v++) {
      if (v % this.dotEvery !== 0) continue;
      const filled = v >= low && v <= high;
      fillCircle(g, xFor(v), cy + 9, v % this.majorEvery === 0 ? 1.8 : 1.0,
          filled ? rgba(accent, 150) : rgba(T.MUTED, 90));
    }

    fillCircle(g, thumbX, cy, 10, rgba(accent, 50));
    fillCircle(g, thumbX, cy, 7, '#F8FAFC');
    setStroke(g, 2.5, false);
    g.strokeStyle = rgba(accent);
    circlePath(g, thumbX, cy, 7);
    g.stroke();
  }
}

/** Sidebar button with a glyph (outlined, like the pendulum's secondary buttons). */
class ModernButton {
  constructor(element, text, accent) {
    this.element = element;
    this.accent = accent;
    element.innerHTML = '<canvas aria-hidden="true"></canvas><span></span>';
    element.querySelector('span').textContent = text;
    this.icon = element.querySelector('canvas');

    s.setProperty('--bg', rgba(accent, 22));

    s.setProperty('--bg-pressed', rgba(accent, 70));
    s.setProperty('--border', rgba(accent, 150));
    s.setProperty('--border-hover', rgba(accent, 230));
    const foreground = T.dark ? mix(accent, WHITE, 0.3) : mix(accent, BLACK, 0.15);
    s.setProperty('--fg', rgba(foreground));

/** Circular arrow ("start over"). */
function paintResetGlyph(g, cx, cy, r, color) {
  setStroke(g, 2, true);
  g.strokeStyle = color;
  g.beginPath();
  g.arc(cx, cy, r, toRadians(-60), toRadians(-350), true);
  g.stroke();
  const a = toRadians(350);
  const ex = cx + r * Math.cos(a);
  const ey = cy - r * Math.sin(a);
  const dx = -Math.sin(a);
  const dy = -Math.cos(a);
  g.beginPath();
  g.moveTo(ex + dx * 4, ey + dy * 4);
  g.lineTo(ex - dy * 3.5, ey + dx * 3.5);
  g.lineTo(ex + dy * 3.5, ey - dx * 3.5);
  g.closePath();
  g.fillStyle = color;
  g.fill();
}

/** Small seeded random generator, so the city looks the same on every run. */
function seededRandom(seed) {
  let state = seed;
  return () => {
    state = (state + 0x6D2B79F5) | 0;
    let t = Math.imul(state ^ (state >>> 15), 1 | state);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const heatmapPhi = new Float64Array(FuzzyRules.RULES);

// Layout in logical pixels (the scene is drawn at 'scale' CSS pixels per logical pixel).
const view = { W: 1000, H: 800, scale: 1, ratio: 1, narrow: false, cssW: 0, cssH: 0 };

let backdrop = null;
let backdropKey = '';

let rateSampleMillis = performance.now();
let rateSampleSteps = 0;
let stepsPerSecond = 0;

let runButtonBounds = null;
let hoverRunButton = false;
let resetButtonBounds = null;
let hoverResetButton = false;
let hoverBurstButton = -1;     // NS, EW or -1
let pressedBurstButton = -1;
