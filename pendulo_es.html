const stage = document.getElementById('stage');
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const startMillis = performance.now();

// Stars with a fixed seed, so the sky is always the same.
const stars = (() => {
  let seed = 7;
  const random = () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const list = [];
  for (let i = 0; i < STAR_COUNT; i++) {
    list.push({
      x: random(), y: Math.pow(random(), 1.3), size: 0.6 + random() * 1.8,
      alpha: 60 + random() * 170, speed: 0.5 + random() * 2.5, phase: random() * Math.PI * 2,
    });
  }
  return list;
})();
const heatmapPhi = new Float64Array(FuzzyRules.RULES);

// Layout in logical pixels (the scene is drawn at 'scale' CSS pixels per logical pixel).
const view = { W: 1000, H: 800, scale: 1, ratio: 1, narrow: false, cssW: 0, cssH: 0 };

let backdrop = null;
let backdropKey = '';

const pointer = {
  hoverCart: false, hoverBob: false, grabbingCart: false, grabbingPole: false,
  grabOffsetPx: 0, lastDragValue: 0, flingVelocity: 0, lastDragMillis: 0, id: null,
};

let telemetryFade = 1;
let learningFade = 1;
let rateSampleMillis = performance.now();
let rateSampleSteps = 0;
let stepsPerSecond = 0;

let goalToggleBounds = null;
let startHintBounds = null;
let hoverGoalToggle = false;
let hoverPushButton = 0;     // -1 = left button, +1 = right button, 0 = none
let pressedPushButton = 0;
let pressedPushMillis = 0;
let seenEndCounter = -1;
let toastText = null;
let toastColor = null;
let toastStart = 0;

/**
 * Fits the scene to the window. Wide screens use the Java layout at 1:1; small screens draw
 * the same scene scaled down, and phones stack the two cards on top of the scene.
 */
function layout() {
  const stacked = window.matchMedia('(max-width: 999px)').matches;
  const cssW = stage.clientWidth;
  let scale;
  let logicalH;
  let narrow = false;
  if (cssW < 600) {
    narrow = true;
    scale = Math.max(0.45, Math.min(1, cssW / 650));
    // Both cards, the upright pole above the cart and the hanging pole below the rail.
    const cards = HUD_MARGIN + ui(150) + 12 + cardHeight();
    logicalH = cards + 12 + (POLE_PX + BOB_R + 92) + (POLE_PX + BOB_R - 92) + HUD_MARGIN + 6;
  } else if (stacked) {
    // Short screens (a phone lying down) keep a readable scale and let the page scroll.
    const availH = Math.max(window.innerHeight * 0.92, 360);
    scale = Math.max(Math.min(1, cssW / 900, availH / 700), Math.min(1, cssW / 900, 0.65));
    logicalH = Math.max(700, Math.min(800, availH / scale));
  } else {
    scale = Math.min(1, cssW / 900, stage.clientHeight / 700);
    logicalH = stage.clientHeight / scale;
  }
  if (stacked) {
    stage.style.setProperty('--stage-height', Math.round(logicalH * scale) + 'px');
  }
  const cssH = stacked ? Math.round(logicalH * scale) : stage.clientHeight;
  const ratio = window.devicePixelRatio || 1;
  view.narrow = narrow;
  view.scale = scale;
  view.ratio = ratio;
  view.cssW = cssW;
  view.cssH = cssH;
  view.W = cssW / scale;
  view.H = cssH / scale;
  const pixelW = Math.max(1, Math.round(cssW * ratio));
  const pixelH = Math.max(1, Math.round(cssH * ratio));
  if (canvas.width !== pixelW || canvas.height !== pixelH) {
    canvas.width = pixelW;
    canvas.height = pixelH;
  }
}

function cardHeight() {
  return ui(214);
}

function telemetryRect() {
  if (view.narrow) return { x: HUD_MARGIN, y: HUD_MARGIN, w: view.W - 2 * HUD_MARGIN, h: ui(150) };
  return { x: HUD_MARGIN, y: HUD_MARGIN, w: ui(270), h: cardHeight() };
}

function learningRect() {
  if (view.narrow) {
    const telemetry = telemetryRect();
    return { x: HUD_MARGIN, y: telemetry.y + telemetry.h + 12, w: view.W - 2 * HUD_MARGIN, h: cardHeight() };
  }
  const cardW = ui(270);
  return { x: 2 * HUD_MARGIN + cardW, y: HUD_MARGIN, w: view.W - 3 * HUD_MARGIN - cardW, h: cardHeight() };
}

function cardsBottom() {
  const learning = learningRect();
  return learning.y + learning.h;
}

/**
 * Ground level: about 79% of the height, low enough for the upright pole to stay below
 * the cards and high enough for a hanging pole to stay above the bottom edge.
 */
function trackY() {
  const pivotBelowTrack = pivotY(0); // negative: the pivot is above the rail
  const highestBob = -pivotBelowTrack + POLE_PX + BOB_R;
  const lowestBob = pivotBelowTrack + POLE_PX + BOB_R;
  const minTrackY = cardsBottom() + 12 + highestBob;
  const maxTrackY = view.H - HUD_MARGIN - lowestBob;
  return Math.round(Math.min(Math.max(view.H * 0.79, minTrackY), maxTrackY));
}

function bodyTop(track) {
  return track - WHEEL_R + 6 - CART_H;
}

/** The pole hangs from a bearing on top of a short pillar above the deck. */
function pivotY(track) {
  return bodyTop(track) - 16;
}

/** Screen x of a rail position (x = 0 is the middle of the scene). */
function screenX(x) {
  return view.W / 2 + x * PIXELS_PER_METER;
}

function render() {
  layout();
  const g = ctx;
  const w = view.W;
  const h = view.H;
  g.setTransform(view.ratio * view.scale, 0, 0, view.ratio * view.scale, 0, 0);
  g.textBaseline = 'alphabetic';

  model.trackHalf = trackHalfFor(w);
  const now = (performance.now() - startMillis) / 1000;
  const track = trackY();
  updateStepRate();
  updateToast(now);

  paintBackdrop(g, w, h, track);
  paintStars(g, w, track, now);
  paintRailEnds(g, track);
  paintTrail(g, track);
  paintRig(g, screenX(model.x), track, now);
  paintStartHint(g, w, track, now);
  paintPushButtons(g, w, track);
  paintToast(g, w, now);

  // Cards become see-through while the pole passes behind them.
  const telemetry = telemetryRect();
  const learning = learningRect();
  telemetryFade = fadeToward(telemetryFade, poleOverlaps(telemetry, track));
  learningFade = fadeToward(learningFade, poleOverlaps(learning, track));
  paintFaded(g, telemetryFade, () => paintTelemetry(g, telemetry, now));
  paintFaded(g, learningFade, () => paintLearning(g, learning));
  paintFooter(g, w, h);
  requestAnimationFrame(render);
}

function poleOverlaps(card, track) {
  const x0 = card.x - BOB_R;
  const y0 = card.y - BOB_R;
  const x1 = card.x + card.w + BOB_R;
  const y1 = card.y + card.h + BOB_R;
  const px = screenX(model.x);
  const py = pivotY(track);
  const tx = px + POLE_PX * Math.sin(model.theta);
  const ty = py - POLE_PX * Math.cos(model.theta);
  // Segment against rectangle: sample the pole densely (it is only 200 px long).
  for (let i = 0; i <= 40; i++) {
    const sx = px + (tx - px) * i / 40;
    const sy = py + (ty - py) * i / 40;
    if (sx >= x0 && sx <= x1 && sy >= y0 && sy <= y1) return true;
  }
  return false;
}

/** Smoothly moves a card's opacity toward see-through (overlapped) or solid. */
function fadeToward(current, overlapped) {
  const target = overlapped ? 0.25 : 1;
  return current + (target - current) * 0.2;
}

function paintFaded(g, alpha, painter) {
  g.save();
  if (alpha < 0.995) g.globalAlpha = alpha;
  painter();
  g.restore();
}

function updateStepRate() {
  const now = performance.now();
  const elapsed = (now - rateSampleMillis) / 1000;
  if (elapsed >= 0.5) {
    stepsPerSecond = (stepCount - rateSampleSteps) / elapsed;
    rateSampleSteps = stepCount;
    rateSampleMillis = now;
  }
}

// ----- static scenery (cached) -----

function paintBackdrop(g, w, h, track) {
  const key = [canvas.width, canvas.height, view.scale, view.ratio, T.version, track].join('|');
  if (!backdrop || backdropKey !== key) {
    backdrop = buildBackdrop(w, h, track);
    backdropKey = key;
  }
  g.drawImage(backdrop, 0, 0, w, h);
}

function buildBackdrop(w, h, track) {
  const image = document.createElement('canvas');
  image.width = canvas.width;
  image.height = canvas.height;
  const g = image.getContext('2d');
  const k = view.ratio * view.scale;
  g.setTransform(k, 0, 0, k, 0, 0);

  // Sky
  g.fillStyle = linear(g, 0, 0, rgba(T.BG_TOP), 0, track, rgba(T.BG_MID));
  g.fillRect(0, 0, w, track + 1);
  paintNebula(g, w * 0.22, h * 0.16, w * 0.38, T.VIOLET, 46);
  paintNebula(g, w * 0.82, h * 0.30, w * 0.30, T.PINK, 26);
  paintNebula(g, w * 0.55, track, w * 0.45, T.CYAN, 30);

  // Floor with perspective grid
  g.fillStyle = linear(g, 0, track, rgba(T.FLOOR_TOP), 0, h, rgba(T.FLOOR_BOTTOM));
  g.fillRect(0, track, w, h - track);

  g.save();
  g.beginPath();
  g.rect(0, track, w, h - track);
  g.clip();
  setStroke(g, 1, false);
  const vanishingX = w / 2;
  g.strokeStyle = rgba(T.GRID, 22);
  for (let i = -40; i <= 40; i++) {
    strokeLine(g, vanishingX + i * 46, track, vanishingX + i * 46 * 4.5, h);
  }
  const rows = 12;
  for (let row = 1; row <= rows; row++) {
    const t = row / rows;
    const y = track + (h - track) * t * t;
    g.strokeStyle = rgba(T.GRID, Math.trunc(8 + 36 * t));
    strokeLine(g, 0, y, w, y);
  }
  g.restore();

  // Horizon glow
  g.fillStyle = linear(g, 0, track - 110, rgba(T.CYAN, 0), 0, track, rgba(T.CYAN, 38));
  g.fillRect(0, track - 110, w, 110);

  // Rail
  setStroke(g, 9, true);
  g.strokeStyle = rgba(T.CYAN, 36);
  strokeLine(g, 0, track, w, track);
  setStroke(g, 2, false);
  g.strokeStyle = rgba(T.RAIL);
  strokeLine(g, 0, track, w, track);

  // Ruler centered on the middle of the rail (every 25 cm, labels every meter)
  setFont(g, MONO, false, 10);
  const center = w / 2;
  const quarterPx = 0.25 * PIXELS_PER_METER;
  const maxQuarter = Math.ceil(center / quarterPx);
  for (let quarter = -maxQuarter; quarter <= maxQuarter; quarter++) {
    const px = center + quarter * quarterPx;
    if (px < 0 || px > w) continue;
    const meter = quarter % 4 === 0;
    const half = quarter % 2 === 0;
    const length = meter ? 10 : half ? 6 : 3;
    setStroke(g, 1, false);
    g.strokeStyle = rgba(T.TEXT, meter ? 130 : 60);
    strokeLine(g, px, track + 5, px, track + 5 + length);
    if (meter) {
      const label = quarter === 0 ? '0' : (quarter / 4) + ' m';
      const labelW = textWidth(g, label);
      const labelX = px - labelW / 2;
      if (labelX >= 0 && labelX + labelW <= w) {
        g.fillStyle = rgba(T.MUTED);
        g.fillText(label.replace('-', '−'), labelX, track + ui(22));
      }
    }
  }

  // Vignette
  const radius = Math.max(w, h) * 0.78;
  g.fillStyle = radial(g, w / 2, h / 2, radius,
      [[0.55, 'rgba(0,0,0,0)'], [1, `rgba(0,0,0,${(T.dark ? 150 : 40) / 255})`]]);
  g.fillRect(0, 0, w, h);
  return image;
}

function paintNebula(g, cx, cy, radius, color, alpha) {
  g.fillStyle = radial(g, cx, cy, radius, [[0, rgba(color, alpha)], [1, rgba(color, 0)]]);
  circlePath(g, cx, cy, radius);
  g.fill();
}

function paintStars(g, w, track, now) {
  if (!T.dark) return; // no stars in daylight
  for (let i = 0; i < STAR_COUNT; i++) {
    const star = stars[i];
    const y = star.y * (track - 30);
    const x = star.x * w;
    const twinkle = 0.55 + 0.45 * Math.sin(now * star.speed + star.phase);
    const alpha = Math.trunc(star.alpha * twinkle * (1 - y / track * 0.6));
    fillCircle(g, x, y, star.size / 2, i % 5 === 0 ? rgba([170, 210, 255], alpha) : rgba(WHITE, alpha));
  }
}

// ----- cart, pole and effects -----

function paintTrail(g, track) {
  const trail = model.trail;
  const n = trail.length;
  if (n < 2) return;
  const py = pivotY(track);
  const poleLength = 2 * HALF_POLE_LENGTH;
  setStroke(g, 1, true);
  for (let i = 1; i < n; i++) {
    const x0 = screenX(trail[i - 1][0]);
    const y0 = py - trail[i - 1][1] * PIXELS_PER_METER;
    const x1 = screenX(trail[i][0]);
    const y1 = py - trail[i][1] * PIXELS_PER_METER;
    const f = i / (n - 1);
    const upright = (1 + trail[i][1] / poleLength) / 2;
    g.strokeStyle = rgba(mix(T.PINK, T.TEAL, upright), Math.trunc(190 * f * f));
    g.lineWidth = 1 + 5 * f;
    strokeLine(g, x0, y0, x1, y1);
  }
}

/** End stops of the rail: the cart may not go past them. */
function paintRailEnds(g, track) {
  const postH = CART_H + 10;
  for (let side = -1; side <= 1; side += 2) {
    const edge = screenX(side * model.trackHalf) + side * (CART_W / 2 + 4);
    const left = side < 0 ? edge - 12 : edge;
    roundRectPath(g, left, track - postH, 12, postH + 4, 6);
    g.fillStyle = '#1A1F2B';
    g.fill();
    g.save();
    g.clip();
    setStroke(g, 5, false);
    g.strokeStyle = rgba(T.AMBER);
    for (let y = track - postH - 12; y < track + 12; y += 14) {
      strokeLine(g, left - 4, y + 12, left + 16, y);
    }
    g.restore();
    roundRectPath(g, left, track - postH, 12, postH + 4, 6);
    setStroke(g, 1, false);
    g.strokeStyle = 'rgba(0,0,0,0.55)';
    g.stroke();
  }
}

function paintRig(g, cx, track, now) {
  const top = bodyTop(track);
  const bodyLeft = cx - CART_W / 2;
  const pivotX = cx;
  const py = pivotY(track);
  const tipX = pivotX + POLE_PX * Math.sin(model.theta);
  const tipY = py - POLE_PX * Math.cos(model.theta);
  const falling = model.falling() > 0;
  const fallColor = model.lastEnd === HIT_WALL ? T.AMBER : T.ROSE;
  const bob = falling ? fallColor : bobColor(model.theta);

  paintCartShadow(g, cx, track);
  if (!falling) {
    paintForceArrows(g, bodyLeft, top + CART_H / 2);
    paintAngleGauge(g, model.theta, pivotX, py, bob);
  }

  setStroke(g, 16, true);
  g.strokeStyle = rgba(bob, 26);
  strokeLine(g, pivotX, py, tipX, tipY);
  setStroke(g, 6, true);
  g.strokeStyle = linear(g, pivotX, py, T.dark ? '#D5DCEB' : '#64748B', tipX, tipY, rgba(bob));
  strokeLine(g, pivotX, py, tipX, tipY);

  paintCartBody(g, bodyLeft, top, now);
  const wheelAngle = model.x / (WHEEL_R / PIXELS_PER_METER); // rolling without slipping
  paintWheel(g, bodyLeft + WHEEL_R + 10, track - WHEEL_R, wheelAngle);
  paintWheel(g, bodyLeft + CART_W - WHEEL_R - 10, track - WHEEL_R, wheelAngle);
  paintPivot(g, pivotX, py, top);
  paintBob(g, tipX, tipY, bob, now);
  if (falling) paintFallMark(g, tipX, tipY, track, fallColor);
}

/** A flash where the pole hits the floor. */
function paintFallMark(g, tipX, tipY, track, color) {
  if (tipY < track - BOB_R - 2) return; // the bob has not reached the floor yet
  const fade = Math.min(1, model.falling() * 3); // fades out at the very end
  g.fillStyle = radial(g, tipX, track, 60, [[0, rgba(color, Math.trunc(150 * fade))], [1, rgba(color, 0)]]);
  circlePath(g, tipX, track, 60);
  g.fill();
}

function paintCartShadow(g, cx, track) {
  const rx = CART_W * 0.75;
  const ry = 9;
  g.save();
  g.translate(cx, track + 2);
  g.scale(1, ry / rx);
  g.fillStyle = radial(g, 0, 0, rx, [[0, 'rgba(0,0,0,0.59)'], [1, 'rgba(0,0,0,0)']]);
  circlePath(g, 0, 0, rx);
  g.fill();
  g.restore();
}

/** Force chosen by the controller (cyan = to the right, pink = to the left) and pushes. */
function paintForceArrows(g, bodyLeft, y) {
  const force = model.force;
  if (force > 0.05) {
    const end = bodyLeft - 10;
    paintArrow(g, end - 20 - force * 7, end, y, T.CYAN, 'F ' + num(force, 1) + ' N');
  } else if (force < -0.05) {
    const end = bodyLeft + CART_W + 10;
    paintArrow(g, end + 20 - force * 7, end, y, T.PINK, 'F ' + num(-force, 1) + ' N');
  }
  const push = model.push;
  if (Math.abs(push) > 0.05) {
    const pushY = y - CART_H * 0.62;
    if (push > 0) {
      const end = bodyLeft - 6;
      paintArrow(g, end - 20 - push * 6, end, pushY, T.AMBER, 'empujón');
    } else {
      const end = bodyLeft + CART_W + 6;
      paintArrow(g, end + 20 - push * 6, end, pushY, T.AMBER, 'empujón');
    }
  }
}

function paintArrow(g, fromX, toX, y, color, label) {
  const direction = Math.sign(toX - fromX);
  const shaftEnd = toX - direction * 12;

  setStroke(g, 10, true);
  g.strokeStyle = rgba(color, 30);
  strokeLine(g, fromX, y, toX, y);

  setStroke(g, 4, true);
  g.strokeStyle = linear(g, fromX, 0, rgba(color, 40), shaftEnd, 0, rgba(color));
  strokeLine(g, fromX, y, shaftEnd, y);

  g.beginPath();
  g.moveTo(toX, y);
  g.lineTo(shaftEnd, y - 8);
  g.lineTo(shaftEnd, y + 8);
  g.closePath();
  g.fillStyle = rgba(color);
  g.fill();

  setFont(g, MONO, true, 11);
  const middle = (fromX + toX) / 2;
  g.fillText(label, middle - textWidth(g, label) / 2, y - 12);
}

function paintAngleGauge(g, theta, px, py, color) {
  const deg = toDegrees(normalizeAngle(theta));

  setStroke(g, 1.2, false, [4, 4]);
  g.strokeStyle = rgba(T.INK, 60);
  strokeLine(g, px, py, px, py - 80);

  // Limits: past them the attempt counts as a fall
  setStroke(g, 2, true);
  g.strokeStyle = rgba(T.ROSE, 170);
  for (let side = -1; side <= 1; side += 2) {
    const a = side * CartPoleModel.FAIL_ANGLE;
    strokeLine(g, px + 40 * Math.sin(a), py - 40 * Math.cos(a), px + 54 * Math.sin(a), py - 54 * Math.cos(a));
  }

  setStroke(g, 2.2, true);
  g.strokeStyle = rgba(color, 190);
  g.beginPath();
  g.arc(px, py, 44, -Math.PI / 2, -Math.PI / 2 + toRadians(deg), deg < 0);
  g.stroke();

  const label = signed(deg, 1) + '°';
  setFont(g, MONO, true, 11);
  const labelW = textWidth(g, label);
  const lx = deg >= 0 ? px - 12 - labelW : px + 12; // opposite side of the pole
  const ly = py - 68;
  const m = g.measureText('Hg');
  const ascent = m.fontBoundingBoxAscent || 12;
  const descent = m.fontBoundingBoxDescent || 4;
  roundRectPath(g, lx - 6, ly - ascent - 3, labelW + 12, ascent + descent + 4, 10);
  g.fillStyle = rgba(T.BG_TOP, 180);
  g.fill();
  g.fillStyle = rgba(color);
  g.fillText(label, lx, ly);
}

/** Lab cart: anodized side panel, aluminium deck, chassis rail, wheel wells, bumpers. */
function paintCartBody(g, left, top, now) {
  const right = left + CART_W;
  const bottom = top + CART_H;
  const wheelY = bottom - 6;
  const wheelXs = [left + WHEEL_R + 10, right - WHEEL_R - 10];

  // Rubber bumpers at both ends
  const bumperY = top + CART_H * 0.3;
  const bumperH = CART_H * 0.36;
  const bumper = linear(g, 0, bumperY, '#2A2F3A', 0, bumperY + bumperH, '#0B0D12');
  roundRectPath(g, left - 6, bumperY, 10, bumperH, 5);
  g.fillStyle = bumper;
  g.fill();
  roundRectPath(g, right - 4, bumperY, 10, bumperH, 5);
  g.fill();

  // Anodized side panel
  roundRectPath(g, left, top, CART_W, CART_H, 8);
  g.fillStyle = linear(g, 0, top, rgba(T.CART_TOP), 0, bottom, rgba(T.CART_BOTTOM));
  g.fill();

  g.save();
  g.clip();

  // Panel seams (dark groove with a light bevel)
  setStroke(g, 1, false);
  for (const seamX of [left + CART_W / 3, left + 2 * CART_W / 3]) {
    g.strokeStyle = 'rgba(0,0,0,0.31)';
    strokeLine(g, seamX, top + 6, seamX, bottom);
    g.strokeStyle = 'rgba(255,255,255,0.12)';
    strokeLine(g, seamX + 1, top + 6, seamX + 1, bottom);
  }

  // Graphite chassis rail along the bottom
  g.fillStyle = linear(g, 0, bottom - 16, '#2C3446', 0, bottom, '#10141E');
  g.fillRect(left, bottom - 16, CART_W, 16);
  g.strokeStyle = 'rgba(255,255,255,0.14)';
  strokeLine(g, left, bottom - 16, right, bottom - 16);

  // Wheel wells
  for (const wheelX of wheelXs) {
    fillCircle(g, wheelX, wheelY, WHEEL_R + 5, '#070A12');
    setStroke(g, 1.2, false);
    g.strokeStyle = 'rgba(255,255,255,0.16)';
    g.stroke();
  }

  // Soft light from above
  g.fillStyle = linear(g, 0, top, 'rgba(255,255,255,0.27)', 0, top + CART_H * 0.45, 'rgba(255,255,255,0)');
  g.fillRect(left, top, CART_W, CART_H * 0.45);
  g.restore();

  // Brushed aluminium deck plate
  roundRectPath(g, left + 4, top - 5, CART_W - 8, 9, 4);
  g.fillStyle = linear(g, 0, top - 5, '#E6EAF2', 0, top + 4, '#7B8599');
  g.fill();
  setStroke(g, 0.6, false);
  g.strokeStyle = 'rgba(255,255,255,0.24)';
  for (let i = 0; i < 3; i++) {
    const y = top - 3 + i * 2.4;
    strokeLine(g, left + 10, y, right - 10, y);
  }
  roundRectPath(g, left + 4, top - 5, CART_W - 8, 9, 4);
  setStroke(g, 0.9, false);
  g.strokeStyle = 'rgba(0,0,0,0.43)';
  g.stroke();

  // Screws in the panel corners
  for (const screwX of [left + 8, right - 8]) {
    paintScrew(g, screwX, top + 10);
    paintScrew(g, screwX, bottom - 23);
  }

  // Status lights in a recessed panel
  const ledX = left + 26;
  const ledY = top + 13;
  roundRectPath(g, ledX - 8, ledY - 6.5, 40, 13, 7);
  g.fillStyle = '#0B1022';
  g.fill();
  setStroke(g, 1, false);
  g.strokeStyle = 'rgba(255,255,255,0.12)';
  g.stroke();
  const led = running ? T.GREEN : T.AMBER;
  for (let i = 0; i < 3; i++) {
    const intensity = running ? 0.5 + 0.5 * Math.sin(now * 6 - i * 0.9) : 1;
    const lx = ledX + i * 12;
    fillCircle(g, lx, ledY, 6, rgba(led, Math.trunc(45 * intensity)));
    fillCircle(g, lx, ledY, 2.6, rgba(led, Math.trunc(110 + 145 * intensity)));
  }

  // Engraved name plate
  const name = 'RK4';
  setFont(g, MONO, true, 9);
  const plateW = textWidth(g, name) + 14;
  const plateH = 9 * FONT_SCALE * 1.3 + 2;
  const plateX = right - 22 - plateW;
  const plateY = top + 13 - plateH / 2;
  roundRectPath(g, plateX, plateY, plateW, plateH, 4);
  g.fillStyle = linear(g, 0, plateY, '#C9D0DD', 0, plateY + plateH, '#8790A4');
  g.fill();
  g.fillStyle = '#2A3142';
  g.fillText(name, plateX + 7, baselineIn(g, plateY, plateH));

  const highlighted = pointer.hoverCart || pointer.grabbingCart;
  roundRectPath(g, left, top, CART_W, CART_H, 8);
  setStroke(g, highlighted ? 2 : 1, false);
  g.strokeStyle = highlighted ? rgba(T.CYAN) : 'rgba(0,0,0,0.47)';
  g.stroke();
}

function paintScrew(g, x, y) {
  g.fillStyle = radial(g, x - 0.8, y - 0.8, 3.2, [[0, '#F2F5FA'], [1, '#5C6580']]);
  circlePath(g, x, y, 2.5);
  g.fill();
  setStroke(g, 0.9, false);
  g.strokeStyle = '#262C3B';
  strokeLine(g, x - 1.5, y + 1.5, x + 1.5, y - 1.5);
}

/** Rubber tire with rotating tread, metal rim with spoke cut-outs and an axle nut. */
function paintWheel(g, cx, cy, angle) {
  const r = WHEEL_R;
  g.fillStyle = radial(g, cx, cy, r, [[0.6, '#2A2F3B'], [0.9, '#161A23'], [1, '#06080C']]);
  circlePath(g, cx, cy, r);
  g.fill();

  setStroke(g, 2, false);
  g.strokeStyle = '#030406';
  for (let k = 0; k < 18; k++) {
    const a = angle + k * 2 * Math.PI / 18;
    strokeLine(g, cx + Math.cos(a) * (r - 3.5), cy + Math.sin(a) * (r - 3.5),
        cx + Math.cos(a) * (r - 0.3), cy + Math.sin(a) * (r - 0.3));
  }
  setStroke(g, 1.4, true);
  g.strokeStyle = 'rgba(255,255,255,0.18)';
  g.beginPath();
  g.arc(cx, cy, r - 2, toRadians(-100), toRadians(-170), true);
  g.stroke();

  const rim = r - 7;
  g.fillStyle = radial(g, cx - rim * 0.3, cy - rim * 0.3, rim * 1.5, [[0, '#E8ECF4'], [1, '#66708A']]);
  circlePath(g, cx, cy, rim);
  g.fill();
  setStroke(g, 1.2, false);
  g.strokeStyle = '#343C50';
  g.stroke();

  setStroke(g, 2.6, true);
  g.strokeStyle = '#2A3042';
  for (let k = 0; k < 5; k++) {
    const a = angle + k * 2 * Math.PI / 5;
    strokeLine(g, cx + Math.cos(a) * 5, cy + Math.sin(a) * 5,
        cx + Math.cos(a) * (rim - 2.5), cy + Math.sin(a) * (rim - 2.5));
  }

  g.fillStyle = radial(g, cx - 1.2, cy - 1.2, 5, [[0, '#FFFFFF'], [1, '#7A849C']]);
  circlePath(g, cx, cy, 4.2);
  g.fill();
  fillCircle(g, cx, cy, 1.6, '#1E2433');
}

/** Aluminium pillar on the deck with the pole bearing on top. */
function paintPivot(g, x, y, top) {
  const baseY = top - 4;
  g.beginPath();
  g.moveTo(x - 18, baseY);
  g.lineTo(x - 8, y);
  g.lineTo(x + 8, y);
  g.lineTo(x + 18, baseY);
  g.closePath();
  g.fillStyle = linear(g, x - 18, 0, '#DDE2EB', x + 18, 0, '#7A8498');
  g.fill();
  setStroke(g, 0.9, false);
  g.strokeStyle = 'rgba(0,0,0,0.43)';
  g.stroke();

  g.fillStyle = radial(g, x - 3, y - 3, 13, [[0, '#8F99AE'], [1, '#262C3B']]);
  circlePath(g, x, y, 10);
  g.fill();
  g.fillStyle = radial(g, x - 2, y - 2, 8, [[0, '#FFFFFF'], [1, '#6E7891']]);
  circlePath(g, x, y, 6.5);
  g.fill();
  setStroke(g, 1, false);
  g.strokeStyle = '#1B2130';
  circlePath(g, x, y, 10);
  g.stroke();
  fillCircle(g, x, y, 2, '#1B2130');
}

function paintBob(g, x, y, color, now) {
  const halo = BOB_R * 3.6;
  g.fillStyle = radial(g, x, y, halo, [[0, rgba(color, 120)], [1, rgba(color, 0)]]);
  circlePath(g, x, y, halo);
  g.fill();

  g.fillStyle = radial(g, x - BOB_R * 0.35, y - BOB_R * 0.4, BOB_R * 1.4,
      [[0, '#FFFFFF'], [0.45, rgba(color)], [1, rgba(mix(color, BLACK, 0.55))]]);
  circlePath(g, x, y, BOB_R);
  g.fill();

  if (pointer.hoverBob || pointer.grabbingPole) {
    setStroke(g, 1.6, true, [4, 5], -now * 18);
    g.strokeStyle = rgba(T.INK, 200);
    circlePath(g, x, y, BOB_R + 7);
    g.stroke();
    g.setLineDash([]);
  }
}

// ----- HUD -----

function paintCard(g, x, y, w, h, title) {
  roundRectPath(g, x, y, w, h, 18);
  g.fillStyle = rgba(T.CARD);
  g.fill();
  g.fillStyle = linear(g, 0, y, 'rgba(255,255,255,0.07)', 0, y + 48, 'rgba(255,255,255,0)');
  g.fill();
  setStroke(g, 1, false);
  g.strokeStyle = rgba(T.INK, 26);
  g.stroke();

  setFont(g, SANS, true, 10.5, 0.14);
  g.fillStyle = rgba(T.MUTED);
  g.fillText(title, x + 18, y + ui(25));
  setFont(g, SANS, false, 10);
}

function paintTelemetry(g, card, now) {
  const { x, y, w, h } = card;
  paintCard(g, x, y, w, h, 'TELEMETRÍA');

  let status;
  let color;
  if (model.dragging) {
    status = 'SUJETANDO';
    color = T.AMBER;
  } else if (running) {
    status = 'EN MARCHA';
    color = T.GREEN;
  } else {
    status = 'EN PAUSA';
    color = T.MUTED;
  }
  setFont(g, SANS, true, 10, 0.1);
  const pillW = textWidth(g, status) + ui(30);
  const pillH = ui(20);
  const pillX = x + w - 14 - pillW;
  const pillY = y + ui(10);
  roundRectPath(g, pillX, pillY, pillW, pillH, pillH);
  g.fillStyle = rgba(color, 34);
  g.fill();
  const pulse = running && !model.dragging ? 0.5 + 0.5 * Math.sin(now * 5) : 1;
  fillCircle(g, pillX + ui(11), pillY + pillH / 2, ui(3.5), rgba(color, Math.trunc(90 + 165 * pulse)));
  g.fillStyle = rgba(color);
  g.fillText(status, pillX + ui(20), baselineIn(g, pillY, pillH));

  const deg = toDegrees(normalizeAngle(model.theta));
  const narrow = view.narrow;
  const rows = [
    ['θ', narrow ? 'ángulo' : 'ángulo', signed(deg, 1) + '°'],
    ['ω', narrow ? 'vel. angular' : 'velocidad angular', signed(toDegrees(model.thetaDot), 1) + '°/s'],
    ['x', narrow ? 'posición' : 'posición en el riel', signed(model.x, 2) + ' m'],
    ['v', narrow ? 'velocidad' : 'velocidad del carrito', signed(model.xDot, 2) + ' m/s'],
    ['F', narrow ? 'fuerza' : 'fuerza inferida', signed(model.force, 1) + ' N'],
    ['t', narrow ? 'tiempo' : 'tiempo en equilibrio', num(model.time, 1) + ' s'],
  ];

  // Narrow screens: two columns of three rows, so the card stays short.
  const columns = narrow ? 2 : 1;
  const perColumn = rows.length / columns;
  const columnW = (w - 36 - (columns - 1) * 24) / columns;
  rows.forEach((row, i) => {
    const column = Math.floor(i / perColumn);
    const left = x + 18 + column * (columnW + 24);
    const rowY = y + ui(58) + (i % perColumn) * ui(22);
    setFont(g, MONO, true, 13);
    g.fillStyle = rgba(T.CYAN);
    g.fillText(row[0], left, rowY);
    setFont(g, SANS, false, 12);
    g.fillStyle = rgba(T.MUTED);
    g.fillText(row[1], left + ui(22), rowY);
    setFont(g, MONO, false, 13);
    g.fillStyle = rgba(T.TEXT);
    drawRight(g, row[2], left + columnW, rowY);
  });

  const lineY = y + h - ui(32);
  setStroke(g, 1, false);
  g.strokeStyle = rgba(T.INK, 20);
  strokeLine(g, x + 16, lineY, x + w - 16, lineY);
  setFont(g, MONO, false, 10);
  g.fillStyle = rgba(T.MUTED);
  g.fillText(`bucle ${SIMULATION_TICK_MS} ms · ${num(stepsPerSecond, 0)} pasos/s · ${compact(loopCount)} ciclos`,
      x + 18, y + h - ui(13));
}

function modeColor(mode) {
  return mode === LEARN ? T.CYAN : T.VIOLET;
}

/** Learning card: one bar per attempt (how long the pole stayed up) and the rule map. */
function paintLearning(g, card) {
  const { x, y, w, h } = card;
  paintCard(g, x, y, w, h, 'APRENDIZAJE');
  goalToggleBounds = paintGoalToggle(g, model.goalEnabled, x + w - 14, y + ui(10));
  setFont(g, MONO, false, 10.5);
  g.fillStyle = rgba(T.MUTED);
  const titleEnd = x + 18 + ui(110);
  let header = `intento ${model.episode}  ·  récord ${formatDuration(model.record, true)}`;
  const right = goalToggleBounds.x - ui(12);
  if (right - textWidth(g, header) < titleEnd) header = `n.º ${model.episode} · ${formatDuration(model.record, true)}`;
  if (right - textWidth(g, header) >= titleEnd) drawRight(g, header, right, y + ui(25));

  const showMap = w >= ui(380);
  const mapSize = showMap ? Math.min(h - ui(78), ui(150)) : 0;
  const chartLeft = x + ui(34);
  const chartRight = x + w - 18 - (showMap ? mapSize + ui(30) : 0);
  const chartTop = y + ui(44);
  const chartBottom = y + h - ui(40);
  paintLearningCurve(g, chartLeft, chartTop, chartRight, chartBottom);
  paintLegend(g, chartLeft, chartRight, y + h - ui(14));
  if (showMap) paintRuleMap(g, x + w - 18 - mapSize, chartTop, mapSize);
}

/** The goal switch (click or G); returns where it was drawn. */
function paintGoalToggle(g, enabled, right, top) {
  const label = enabled ? `Meta ${num(CartPoleModel.EPISODE_GOAL, 0)} s` : 'Sin meta';
  const color = enabled ? T.GREEN : T.MUTED;
  setFont(g, SANS, true, 10);
  const trackW = ui(22);
  const trackH = ui(12);
  const pillH = ui(20);
  const pillW = ui(8) + trackW + ui(6) + textWidth(g, label) + ui(10);
  const pillX = right - pillW;
  roundRectPath(g, pillX, top, pillW, pillH, pillH);
  g.fillStyle = rgba(color, hoverGoalToggle ? 55 : 30);
  g.fill();
  if (hoverGoalToggle) {
    setStroke(g, 1.2, false);
    g.strokeStyle = rgba(color);
    g.stroke();
  }
  const trackX = pillX + ui(8);
  const trackTop = top + (pillH - trackH) / 2;
  roundRectPath(g, trackX, trackTop, trackW, trackH, trackH);
  g.fillStyle = enabled ? rgba(T.GREEN) : rgba(T.MUTED, 120);
  g.fill();
  const knobR = trackH / 2 - 2;
  const knobX = enabled ? trackX + trackW - trackH / 2 : trackX + trackH / 2;
  fillCircle(g, knobX, trackTop + trackH / 2, knobR, '#FFFFFF');
  g.fillStyle = rgba(color);
  g.fillText(label, trackX + trackW + ui(6), baselineIn(g, top, pillH));
  return { x: pillX, y: top, w: pillW, h: pillH };
}

/** Smallest round scale (s) that fits the longest attempt, for charts without a goal. */
function niceScale(longest) {
  for (const step of [60, 120, 180, 300, 600, 900, 1200, 1800, 3600]) {
    if (longest <= step) return step;
  }
  return Math.ceil(longest / 3600) * 3600;
}

function paintLearningCurve(g, left, top, right, bottom) {
  const height = bottom - top;
  const log = model.log;
  // Vertical scale: the goal or, without a goal, the longest attempt on the chart.
  let goal = CartPoleModel.EPISODE_GOAL;
  if (!model.goalEnabled) {
    let longest = model.time;
    for (const entry of log) longest = Math.max(longest, entry.duration);
    goal = niceScale(longest);
  }

  setFont(g, MONO, false, 9.5);
  setStroke(g, 1, false);
  for (let k = 0; k <= 4; k++) {
    const seconds = goal * k / 4;
    const gy = bottom - k / 4 * height;
    g.strokeStyle = rgba(T.INK, k === 0 ? 40 : 14);
    strokeLine(g, left, gy, right, gy);
    g.fillStyle = rgba(T.MUTED);
    drawRight(g, k === 0 ? '0' : formatDuration(seconds, false), left - 6, gy + 3.5);
  }
  if (model.goalEnabled) {
    setStroke(g, 1.4, false, [5, 4]);
    g.strokeStyle = rgba(T.GREEN, 200);
    strokeLine(g, left, top, right, top);
    g.setLineDash([]);
    setFont(g, SANS, true, 9.5);
    g.fillStyle = rgba(T.GREEN, 200);
    drawRight(g, 'meta', right, top - 4);
  }

  const slots = Math.max(10, Math.trunc((right - left) / ui(5)));
  const shown = Math.min(log.length, slots - 1); // the last slot is the current attempt
  const first = log.length - shown;
  const slot = (right - left) / slots;
  const barW = Math.max(1.5, slot * 0.72);

  if (log.length === 0 && model.time < 0.05) {
    setFont(g, SANS, false, 11);
    g.fillStyle = rgba(T.MUTED);
    const hint = 'cada intento se convierte en una barra aquí';
    g.fillText(hint, (left + right - textWidth(g, hint)) / 2, (top + bottom) / 2);
  }

  for (let i = 0; i < shown; i++) {
    const entry = log[first + i];
    const barH = Math.max(2, Math.min(entry.duration, goal) / goal * height);
    const bx = left + i * slot + (slot - barW) / 2;
    const color = entry.end === GOAL ? T.GREEN : modeColor(entry.mode);
    roundRectPath(g, bx, bottom - barH, barW, barH, 3);
    g.fillStyle = rgba(color, 200);
    g.fill();
  }

  // Current attempt, still growing
  const liveH = Math.max(2, Math.min(model.time, goal) / goal * height);
  const liveX = left + shown * slot + (slot - barW) / 2;
  const live = modeColor(model.mode);
  roundRectPath(g, liveX, bottom - liveH, barW, liveH, 3);
  g.fillStyle = rgba(live, 70);
  g.fill();
  setStroke(g, 1.2, false);
  g.strokeStyle = rgba(live);
  g.stroke();

  // Moving average of the last 10 attempts: the learning trend
  if (shown >= 2) {
    g.beginPath();
    for (let i = 0; i < shown; i++) {
      let sum = 0;
      let count = 0;
      for (let k = Math.max(0, first + i - 9); k <= first + i; k++) {
        sum += Math.min(log[k].duration, goal);
        count++;
      }
      const px = left + i * slot + slot / 2;
      const py = bottom - sum / count / goal * height;
      if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    setStroke(g, 5, true);
    g.strokeStyle = rgba(T.PANEL, 160);
    g.stroke();
    setStroke(g, 2.2, true);
    g.strokeStyle = rgba(T.TEXT);
    g.stroke();
  }
}

function paintLegend(g, x, maxX, baselineY) {
  const labels = ['aprendiz', 'experto', 'meta alcanzada', 'media de 10'];
  const colors = [T.CYAN, T.VIOLET, T.GREEN, T.TEXT];
  setFont(g, SANS, false, 9.5);
  let cx = x;
  for (let i = 0; i < labels.length; i++) {
    const labelW = textWidth(g, labels[i]);
    if (cx + 16 + labelW > maxX) break; // no room left next to the rule map
    if (i === labels.length - 1) {
      setStroke(g, 2.2, true);
      g.strokeStyle = rgba(colors[i]);
      strokeLine(g, cx, baselineY - 4, cx + 12, baselineY - 4);
    } else {
      roundRectPath(g, cx + 2, baselineY - 9, 8, 9, 2);
      g.fillStyle = rgba(colors[i]);
      g.fill();
    }
    g.fillStyle = rgba(T.MUTED);
    g.fillText(labels[i], cx + 16, baselineY);
    cx += 16 + labelW + ui(10);
  }
}

/**
 * Map of the fuzzy rule base: the force it applies for each pole angle (horizontal) and
 * angular velocity (vertical), with the cart stopped in the middle. Cyan pushes right,
 * pink pushes left; it starts blank and fills in as the cart learns.
 */
function paintRuleMap(g, x, y, size) {
  const cells = 26;
  const cell = size / cells;
  const forces = model.ruleForces();
  const state = [0, 0, 0, 0];
  for (let i = 0; i < cells; i++) {
    for (let j = 0; j < cells; j++) {
      state[0] = (-1 + 2 * (i + 0.5) / cells) * FuzzyRules.THETA_SCALE;
      state[1] = (1 - 2 * (j + 0.5) / cells) * FuzzyRules.OMEGA_SCALE;
      const f = FuzzyRules.infer(forces, state, heatmapPhi);
      const intensity = Math.min(1, Math.abs(f) / MAX_FORCE_NEWTONS);
      g.fillStyle = rgba(mix(T.FIELD, f >= 0 ? T.CYAN : T.PINK, intensity));
      g.fillRect(x + i * cell, y + j * cell, cell + 0.6, cell + 0.6);
    }
  }
  setStroke(g, 1, false);
  g.strokeStyle = rgba(T.INK, 40);
  strokeLine(g, x + size / 2, y, x + size / 2, y + size);
  strokeLine(g, x, y + size / 2, x + size, y + size / 2);
  g.strokeStyle = rgba(T.INK, 60);
  g.strokeRect(x, y, size, size);

  // Where the system is right now
  const nx = Math.max(-1, Math.min(1, normalizeAngle(model.theta) / FuzzyRules.THETA_SCALE));
  const ny = Math.max(-1, Math.min(1, model.thetaDot / FuzzyRules.OMEGA_SCALE));
  const dotX = x + (nx + 1) / 2 * size;
  const dotY = y + (1 - ny) / 2 * size;
  setStroke(g, 2, false);
  g.strokeStyle = rgba(T.INK, 220);
  circlePath(g, dotX, dotY, 5);
  g.stroke();
  fillCircle(g, dotX, dotY, 2, T.dark ? '#FFFFFF' : rgba(T.INK));

  setFont(g, SANS, false, 9.5);
  g.fillStyle = rgba(T.MUTED);
  g.fillText('ángulo θ →', x, y + size + ui(12));
  drawRight(g, 'mapa de reglas', x + size, y + size + ui(12));
  g.save();
  g.translate(x - 5, y + size);
  g.rotate(-Math.PI / 2);
  g.fillText('vel. angular ω →', 0, 0);
  g.restore();
}

/** Shows how the last attempt ended, for a moment. */
function updateToast(now) {
  if (model.endCounter === seenEndCounter) return;
  if (seenEndCounter >= 0 && model.lastEnd) {
    const episode = model.lastEndEpisode;
    const duration = model.lastEndDuration;
    if (model.lastEnd === GOAL) {
      toastText = `¡Meta alcanzada! El intento ${episode} se equilibró ${num(duration, 0)} s`;
      toastColor = T.GREEN;
    } else if (model.lastEnd === HIT_WALL) {
      toastText = `Chocó con el final del riel · intento ${episode} · ${num(duration, 1)} s`;
      toastColor = T.AMBER;
    } else {
      toastText = `¡Se cayó! Intento ${episode} · ${num(duration, 1)} s`;
      toastColor = T.ROSE;
    }
    toastStart = now;
  }
  seenEndCounter = model.endCounter;
}

function paintToast(g, w, now) {
  const age = now - toastStart;
  if (!toastText || age > 1.8) return;
  const alpha = age < 1.2 ? 1 : 1 - (age - 1.2) / 0.6;
  g.save();
  g.globalAlpha = Math.max(0, alpha);
  setFont(g, SANS, true, 12);
  const pillW = textWidth(g, toastText) + ui(32);
  const pillH = ui(30);
  const pillX = (w - pillW) / 2;
  const pillY = cardsBottom() + ui(14);
  roundRectPath(g, pillX, pillY, pillW, pillH, pillH);
  g.fillStyle = rgba(T.BG_TOP, 220);
  g.fill();
  setStroke(g, 1.4, false);
  g.strokeStyle = rgba(toastColor);
  g.stroke();
  g.fillStyle = rgba(toastColor);
  g.fillText(toastText, pillX + ui(16), baselineIn(g, pillY, pillH));
  g.restore();
}

function paintFooter(g, w, h) {
  setFont(g, SANS, false, 10);
  g.fillStyle = rgba(T.MUTED);
  const full = 'Espacio iniciar/detener  ·  R reiniciar  ·  M cambiar controlador  ·  '
      + '← → empujón  ·  G meta  ·  T tema  ·  arrastra el carrito o la bolita';
  const short = 'Arrastra el carrito o la bolita  ·  toca la meta para activarla o desactivarla';
  const text = textWidth(g, full) <= w - 2 * HUD_MARGIN ? full : short;
  if (textWidth(g, text) <= w - 2 * HUD_MARGIN) g.fillText(text, HUD_MARGIN, h - 12);
}

function paintStartHint(g, w, track, now) {
  startHintBounds = null;
  if (running || model.dragging) return;
  const message = model.time === 0 ? 'Pulsa Espacio o Iniciar para empezar'
      : 'En pausa · pulsa Espacio para continuar';
  setFont(g, SANS, true, 13);
  const pillW = textWidth(g, message) + ui(52);
  const pillH = ui(34);
  // Centered, but moved left when it would cover the push buttons.
  const buttonsLeft = pushButtons(w, track)[0].x;
  const pillX = Math.max(HUD_MARGIN, Math.min((w - pillW) / 2, buttonsLeft - 16 - pillW));
  const pillY = track + 46;
  const pulse = 0.6 + 0.4 * Math.sin(now * 3);

  roundRectPath(g, pillX, pillY, pillW, pillH, pillH);
  g.fillStyle = rgba(T.BG_TOP, 210);
  g.fill();
  setStroke(g, 1.4, false);
  g.strokeStyle = rgba(T.CYAN, Math.trunc(60 + 130 * pulse));
  g.stroke();

  const cy = pillY + pillH / 2;
  g.beginPath();
  g.moveTo(pillX + ui(18), cy - ui(6));
  g.lineTo(pillX + ui(29), cy);
  g.lineTo(pillX + ui(18), cy + ui(6));
  g.closePath();
  g.fillStyle = rgba(T.CYAN);
  g.fill();

  g.fillStyle = rgba(T.TEXT);
  g.fillText(message, pillX + ui(38), baselineIn(g, pillY, pillH));
  startHintBounds = { x: pillX, y: pillY, w: pillW, h: pillH };
}

/** The two push buttons on the floor, at the right: [push left, push right]. */
function pushButtons(w, track) {
  const bw = ui(48);
  const bh = ui(34);
  const gap = 8;
  const y = track + 46;
  const right = w - HUD_MARGIN;
  return [
    { dir: -1, x: right - 2 * bw - gap, y, w: bw, h: bh },
    { dir: +1, x: right - bw, y, w: bw, h: bh },
  ];
}

/** Buttons that push the cart (like the arrow keys); also the way to push on touch screens. */
function paintPushButtons(g, w, track) {
  const buttons = pushButtons(w, track);
  const now = performance.now();
  for (const b of buttons) {
    const pressed = pressedPushButton === b.dir && now - pressedPushMillis < CartPoleModel.PUSH_DURATION * 1000;
    const hover = hoverPushButton === b.dir;
    roundRectPath(g, b.x, b.y, b.w, b.h, 12);
    g.fillStyle = rgba(T.BG_TOP, 200);
    g.fill();
    g.fillStyle = rgba(T.AMBER, pressed ? 110 : hover ? 60 : 30);
    g.fill();
    setStroke(g, pressed || hover ? 1.6 : 1.2, false);
    g.strokeStyle = rgba(T.AMBER, pressed || hover ? 240 : 150);
    g.stroke();

    // Arrow pointing where the cart will be pushed
    const cx = b.x + b.w / 2;
    const cy = b.y + b.h / 2;
    const half = ui(11);
    const tip = cx + b.dir * half;
    const shaftEnd = tip - b.dir * ui(8);
    setStroke(g, 3.5, true);
    g.strokeStyle = rgba(T.AMBER);
    strokeLine(g, cx - b.dir * half, cy, shaftEnd, cy);
    g.beginPath();
    g.moveTo(tip, cy);
    g.lineTo(shaftEnd, cy - ui(6));
    g.lineTo(shaftEnd, cy + ui(6));
    g.closePath();
    g.fillStyle = rgba(T.AMBER);
    g.fill();
  }
  const first = buttons[0];
  const last = buttons[1];
  setFont(g, SANS, false, 9.5);
  g.fillStyle = rgba(T.MUTED);
  const text = 'empujón';
  g.fillText(text, (first.x + last.x + last.w - textWidth(g, text)) / 2, first.y + first.h + ui(14));
}

function pushButtonAt(x, y) {
  for (const b of pushButtons(view.W, trackY())) {
    if (inside(b, x, y)) return b.dir;
  }
  return 0;
}

// ----- mouse and touch interaction -----

function inside(rect, x, y) {
  return rect && x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h;
}

function hitTest(mx, my) {
  const track = trackY();
  const py = pivotY(track);
  const cx = screenX(model.x);
  const tipX = cx + POLE_PX * Math.sin(model.theta);
  const tipY = py - POLE_PX * Math.cos(model.theta);
  if (Math.hypot(mx - tipX, my - tipY) <= BOB_R + 9) return HIT_BOB;
  if (mx >= cx - CART_W / 2 - 6 && mx <= cx + CART_W / 2 + 6
      && my >= bodyTop(track) - 26 && my <= track + 4) {
    return HIT_CART;
  }
  return HIT_NONE;
}

/** Pointer position in the scene's logical pixels. */
function scenePoint(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / view.scale, y: (e.clientY - rect.top) / view.scale };
}

function updateHover(x, y) {
  hoverGoalToggle = inside(goalToggleBounds, x, y);
  hoverPushButton = pushButtonAt(x, y);
  if (hoverGoalToggle || hoverPushButton !== 0 || inside(startHintBounds, x, y)) {
    pointer.hoverBob = false;
    pointer.hoverCart = false;
    canvas.style.cursor = 'pointer';
    return;
  }
  const hit = hitTest(x, y);
  pointer.hoverBob = hit === HIT_BOB;
  pointer.hoverCart = hit === HIT_CART;
  canvas.style.cursor = hit === HIT_NONE ? 'default' : 'pointer';
}

function clampMagnitude(value, limit) {
  return Math.max(-limit, Math.min(limit, value));
}

canvas.addEventListener('pointerdown', e => {
  canvas.focus({ preventScroll: true });
  if (e.button !== 0) return;
  const p = scenePoint(e);
  if (inside(goalToggleBounds, p.x, p.y)) {
    toggleGoal();
    return;
  }
  const push = pushButtonAt(p.x, p.y);
  if (push !== 0) {
    model.pushCart(push, model.pushStrength); // the buttons follow the push strength slider
    pressedPushButton = push;
    pressedPushMillis = performance.now();
    return;
  }
  if (inside(startHintBounds, p.x, p.y)) {
    startSimulation();
    return;
  }
  const hit = hitTest(p.x, p.y);
  if (hit === HIT_NONE) return;
  pointer.grabbingPole = hit === HIT_BOB;
  pointer.grabbingCart = hit === HIT_CART;
  if (pointer.grabbingCart) {
    pointer.grabOffsetPx = p.x - screenX(model.x);
    pointer.lastDragValue = model.x;
  } else {
    pointer.lastDragValue = model.theta;
  }
  pointer.lastDragMillis = performance.now();
  pointer.flingVelocity = 0;
  pointer.id = e.pointerId;
  canvas.setPointerCapture(e.pointerId);
  model.setDragging(true);
  canvas.style.cursor = 'move';
});

canvas.addEventListener('pointermove', e => {
  const p = scenePoint(e);
  if (!pointer.grabbingCart && !pointer.grabbingPole) {
    updateHover(p.x, p.y);
    return;
  }
  let value;
  if (pointer.grabbingCart) {
    value = (p.x - pointer.grabOffsetPx - view.W / 2) / PIXELS_PER_METER;
    model.moveCart(value);
  } else {
    const pivotX = screenX(model.x);
    const angle = Math.atan2(p.x - pivotX, pivotY(trackY()) - p.y);
    model.rotatePole(angle);
    value = pointer.lastDragValue + normalizeAngle(angle - pointer.lastDragValue); // continuous angle
  }
  const now = performance.now();
  const dt = (now - pointer.lastDragMillis) / 1000;
  if (dt > 1e-3) {
    const velocity = (value - pointer.lastDragValue) / dt;
    pointer.flingVelocity = 0.65 * velocity + 0.35 * pointer.flingVelocity;
    pointer.lastDragValue = value;
    pointer.lastDragMillis = now;
  }
});

function releasePointer(e) {
  if (!pointer.grabbingCart && !pointer.grabbingPole) return;
  const idle = (performance.now() - pointer.lastDragMillis) / 1000;
  const velocity = idle > 0.08 ? 0 : pointer.flingVelocity; // the user stopped before releasing
  if (pointer.grabbingCart) {
    model.releaseCart(clampMagnitude(velocity, MAX_FLING_CART));
  } else {
    model.releasePole(clampMagnitude(velocity, MAX_FLING_POLE));
  }
  pointer.grabbingCart = false;
  pointer.grabbingPole = false;
  pointer.id = null;
  const p = scenePoint(e);
  updateHover(p.x, p.y);
}

canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);
canvas.addEventListener('pointerleave', () => {
  if (!pointer.grabbingCart && !pointer.grabbingPole) {
    pointer.hoverBob = false;
    pointer.hoverCart = false;
    hoverGoalToggle = false;
    hoverPushButton = 0;
    canvas.style.cursor = 'default';
  }
});

// On touch screens, grabbing the cart or the bob must not scroll the page.
canvas.addEventListener('touchstart', e => {
  const touch = e.touches[0];
  if (!touch) return;
  const p = scenePoint(touch);
  if (hitTest(p.x, p.y) !== HIT_NONE || pushButtonAt(p.x, p.y) !== 0) e.preventDefault();
}, { passive: false });

// ---------------------------------------------------------------------------
// Startup
// ---------------------------------------------------------------------------

/** Copies every slider value into the model (used once, at startup). */
function applySettings() {
  speed = speedInput.getValue();
  model.learningRate = learningRateInput.getValue();
  model.exploration = explorationInput.getValue();
  model.initialAngle = toRadians(initialAngleInput.getValue());
  model.pushStrength = pushInput.getValue();
  model.pushChance = pushChanceInput.getValue() / 100;
  model.expertSkill = expertSkillInput.getValue() / 100;
  model.setMasses(cartMassInput.getValue(), poleMassInput.getValue());
  layout();
  model.trackHalf = trackHalfFor(view.W);
  model.restartEpisode();
}

buildSidebar();
applyTheme(loadDarkTheme());
applySettings();
updateButtons();
// Sliders are drawn at their real width once the layout exists (and again on resize).
new ResizeObserver(() => allSliders.forEach(slider => slider.paint())).observe(document.getElementById('sidebar'));
canvas.focus({ preventScroll: true });
requestAnimationFrame(render);
</script>
</body>
